// ---------- 가짜 Google Apps Script 서비스 ----------
function pad(n){ return String(n).length < 2 ? '0' + n : String(n); }
function fmtDate(d, fmt) {
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), dd = pad(d.getDate());
  if (fmt === 'yyyy-MM') return y + '-' + m;
  if (fmt === 'yyyyMM') return '' + y + m;
  if (fmt === 'yyyy-MM-dd') return y + '-' + m + '-' + dd;
  if (fmt === 'yyyy-MM-dd HH:mm:ss') return y + '-' + m + '-' + dd + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  return d.toString();
}
function makeSheet(name, values) {
  const grid = (values || []).map(function (r) { return r.slice(); });
  const sheet = {
    _name: name, _grid: grid,
    getName: function () { return name; },
    getLastRow: function () {
      let n = 0;
      for (let i = 0; i < grid.length; i++) {
        const row = grid[i] || [];
        if (row.some(function (v) { return v !== '' && v !== null && v !== undefined; })) n = i + 1;
      }
      return n;
    },
    getLastColumn: function () {
      let m = 0;
      grid.forEach(function (row) {
        for (let j = row.length - 1; j >= 0; j--) {
          if (row[j] !== '' && row[j] !== null && row[j] !== undefined) { m = Math.max(m, j + 1); break; }
        }
      });
      return m;
    },
    setFrozenRows: function () {},
    getRange: function (r, c, nr, nc) {
      nr = (nr === undefined) ? 1 : nr;
      nc = (nc === undefined) ? 1 : nc;
      return {
        getValues: function () {
          const out = [];
          for (let i = 0; i < nr; i++) {
            const row = [];
            for (let j = 0; j < nc; j++) {
              const src = grid[r - 1 + i] || [];
              const v = src[c - 1 + j];
              row.push(v === undefined || v === null ? '' : v);
            }
            out.push(row);
          }
          return out;
        },
        setValues: function (vals) {
          for (let i = 0; i < vals.length; i++) {
            const ri = r - 1 + i;
            if (!grid[ri]) grid[ri] = [];
            for (let j = 0; j < vals[i].length; j++) grid[ri][c - 1 + j] = vals[i][j];
          }
          return this;
        },
        setValue: function (v) { if (!grid[r - 1]) grid[r - 1] = []; grid[r - 1][c - 1] = v; return this; },
        setFontWeight: function () { return this; },
        setBackground: function () { return this; },
        setFontColor: function () { return this; }
      };
    },
    appendRow: function (vals) { grid.push(vals.slice()); },
    deleteRow: function (idx) { grid.splice(idx - 1, 1); }
  };
  return sheet;
}

// ----------------------------------------------------------------------------
// 1. 웹앱 진입점 & 스프레드시트 커스텀 메뉴
// ----------------------------------------------------------------------------
function doGet(e) {
  const params = (e && e.parameter) || {};
  const action = String(params.action || '').trim().toLowerCase();

  // (1) 상태 확인 — PWA [연결 테스트] 에서 호출:  ...?action=ping
  if (action === 'ping' || action === 'status') {
    return apiTextOutput_({ ok: true, result: apiStatus_() }, params.callback);
  }

  // (2) 외부(PWA) 함수 호출의 JSONP 폴백: ...?action=api&fn=...&args=...&callback=...
  if (action === 'api' || action === 'call') {
    return apiTextOutput_(apiHandle_({ fn: params.fn, args: params.args, token: params.token }), params.callback);
  }

  // (3) 그 외 — 기존과 동일하게 웹앱 화면(Index.html)을 반환
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('수메디팜 미니 CRM v1.2')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

/**
* 외부(GitHub Pages PWA)에서 오는 fetch(POST) 호출
*   본문: {"fn":"getTurnoverDashboard", "args":[...], "token":"..."}
*   ※ Content-Type: text/plain 으로 보내므로 CORS preflight 가 없습니다.
*/
function doPost(e) {
  let req = {};
  try {
    const raw = (e && e.postData && e.postData.contents) ? e.postData.contents : '';
    req = raw ? JSON.parse(raw) : {};
  } catch (err) {
    return apiTextOutput_({ ok: false, error: { code: 'BAD_REQUEST', message: '요청 본문을 해석하지 못했습니다.' } });
  }
  return apiTextOutput_(apiHandle_(req));
}

*/
function initializeSheets() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();

  Object.keys(SHEET_HEADERS).forEach(function (name) {
    let sheet = ss.getSheetByName(name);
    if (!sheet) {
      sheet = ss.insertSheet(name);
    }
    const headers = SHEET_HEADERS[name];

    if (sheet.getLastRow() === 0) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      styleHeader_(sheet, headers.length);
      sheet.setFrozenRows(1);
    } else {
      // 기존 시트에 뒤쪽 컬럼이 모자라면 맨 뒤에 덧붙입니다(기존 데이터/열 순서 보존).
      ensureTrailingHeaders_(sheet, headers);
    }
  });

  // 설정 시트에 기본값 채우기 (비어 있을 때만)
  const settingSheet = ss.getSheetByName(SHEET_NAMES.SETTINGS);
  if (settingSheet.getLastRow() <= 1) {
    settingSheet.getRange(2, 1, DEFAULT_SETTINGS.length, 3).setValues(DEFAULT_SETTINGS);
  }

  // 사용자 시트에 기본 계정 입력 (아이디가 하나도 없을 때만)
  const userSheet = ss.getSheetByName(SHEET_NAMES.USERS);
  if (userSheet.getLastRow() <= 1) {
    userSheet.getRange(2, 1, DEFAULT_USERS.length, 5).setValues(DEFAULT_USERS);
  }

  return { success: true, message: '필수 시트(8개) 초기화가 완료되었습니다.' };
}

function styleHeader_(sheet, colCount) {
  sheet.getRange(1, 1, 1, colCount)
    .setFontWeight('bold')
    .setBackground('#1e3a5f')
    .setFontColor('#ffffff');
}

/**
* 기존 헤더 뒤에 스키마에만 있는 헤더를 덧붙임 (열 삽입/이동 없음 → 데이터 손상 없음)
*/
function ensureTrailingHeaders_(sheet, requiredHeaders) {
  if (sheet.getLastRow() === 0) return;
  const lastCol = Math.max(sheet.getLastColumn(), 1);
  const current = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); });
  const missing = requiredHeaders.filter(function (h) { return current.indexOf(h) === -1 && h !== ''; });
  if (!missing.length) return;
  sheet.getRange(1, current.length + 1, 1, missing.length).setValues([missing]);
  styleHeader_(sheet, current.length + missing.length);
}

// ----------------------------------------------------------------------------
// 2. 공통 유틸리티 (시트 CRUD / 날짜·숫자 변환 / 동시성 제어)
// ----------------------------------------------------------------------------
function getSheet_(name) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(name);
  if (!sheet) {
    initializeSheets();
    sheet = ss.getSheetByName(name);
  }
  return sheet;
}

function getAllRowsAsObjects_(sheetName) {
  const sheet = getSheet_(sheetName);
  const lastRow = sheet.getLastRow();
  const lastCol = sheet.getLastColumn();
  if (lastRow <= 1 || lastCol === 0) return [];

  const values = sheet.getRange(1, 1, lastRow, lastCol).getValues();
  const headers = values[0].map(function (h) { return String(h).trim(); });
  const rows = [];

  for (let i = 1; i < values.length; i++) {
    const row = values[i];
    const isEmpty = row.every(function (v) { return v === '' || v === null || v === undefined; });
    if (isEmpty) continue;

    const obj = { _rowIndex: i + 1 };
    for (let j = 0; j < headers.length; j++) {
      let val = row[j];
      if (val instanceof Date) {
        val = formatDate_(val);
      }
      obj[headers[j]] = val;
    }
    rows.push(obj);
  }
  return rows;
}

function formatDate_(dateObj) {
  if (!dateObj) return '';
  if (typeof dateObj === 'string') {
    const trimmed = dateObj.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
    const parsed = new Date(trimmed);
    if (!isNaN(parsed.getTime())) {
      return Utilities.formatDate(parsed, Session.getScriptTimeZone(), 'yyyy-MM-dd');
    }
    return trimmed;
  }
  return Utilities.formatDate(dateObj, Session.getScriptTimeZone(), 'yyyy-MM-dd');
}

function formatDateTime_(dateObj) {
  return Utilities.formatDate(dateObj || new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm:ss');
}

function toNum_(val, defaultVal) {
  if (val === '' || val === null || val === undefined) return defaultVal || 0;
  const n = Number(String(val).replace(/,/g, '').trim());
  return isNaN(n) ? (defaultVal || 0) : n;
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    return fn();
  } finally {
    lock.releaseLock();
  }
}

function normalizeName_(v) {
  return String(v === null || v === undefined ? '' : v).replace(/\s+/g, '').trim();
}

function currentMonth_() {
  return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM');
}

/**
* 헤더 이름 기준으로 한 행을 기록 (열 순서 변경/추가에 안전)
*/
function writeRowByHeaders_(sheet, dataObj, rowIndex) {
  const lastCol = Math.max(sheet.getLastColumn(), 1);
  const headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); });
  const values = headers.map(function (h) {
    return dataObj.hasOwnProperty(h) && dataObj[h] !== undefined && dataObj[h] !== null ? dataObj[h] : '';
  });
  if (rowIndex) {
    sheet.getRange(Number(rowIndex), 1, 1, values.length).setValues([values]);
  } else {
    sheet.appendRow(values);
  }
}

function headerIndex_(sheet, headerName, fallbackIndex) {
  const lastCol = Math.max(sheet.getLastColumn(), 1);
  const headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); });
  const idx = headers.indexOf(headerName);
  return idx === -1 ? fallbackIndex : idx + 1;
}

// ----------------------------------------------------------------------------
// 3. 인증/세션 (담당자별 로그인 · MASTER / STAFF 권한)
// ----------------------------------------------------------------------------
function getAllUsers_() {
  return getAllRowsAsObjects_(SHEET_NAMES.USERS).map(function (r) {
    return {
      _rowIndex: r._rowIndex,
      아이디: String(r['아이디'] || '').trim(),
      비밀번호: String(r['비밀번호'] || '').trim(),
      담당자명: String(r['담당자명'] || '').trim(),
      권한: String(r['권한'] || 'STAFF').trim().toUpperCase(),
      사용여부: String(r['사용여부'] || 'Y').trim().toUpperCase() === 'N' ? 'N' : 'Y'
    };
  }).filter(function (u) { return u.아이디; });
}

function sessionKey_(token) {
  return 'CRM_SESS_' + String(token || '').trim();
}

function writeSession_(token, payload) {
  try { PropertiesService.getScriptProperties().setProperty(sessionKey_(token), payload); } catch (e) {}
  try { CacheService.getScriptCache().put(sessionKey_(token), payload, 21600); } catch (e) {}
}

function readSessionRaw_(token) {
  if (!token) return '';
  try {
    const cached = CacheService.getScriptCache().get(sessionKey_(token));
    if (cached) return cached;
  } catch (e) {}
  try {
    return PropertiesService.getScriptProperties().getProperty(sessionKey_(token)) || '';
  } catch (e) {
    return '';
  }
}

function clearSession_(token) {
  if (!token) return;
  try { PropertiesService.getScriptProperties().deleteProperty(sessionKey_(token)); } catch (e) {}
  try { CacheService.getScriptCache().remove(sessionKey_(token)); } catch (e) {}
}

function createSession_(user) {
  // 만료 세션 정리
  try {
    const props = PropertiesService.getScriptProperties();
    const all = props.getProperties();
    const now = Date.now();
    Object.keys(all).forEach(function (k) {
      if (k.indexOf('CRM_SESS_') !== 0) return;
      try {
        const s = JSON.parse(all[k]);
        if (!s || !s.exp || s.exp < now) props.deleteProperty(k);
      } catch (e) {
        props.deleteProperty(k);
      }
    });
  } catch (e) {}

  const token = Utilities.getUuid().replace(/-/g, '');
  const payload = JSON.stringify({
    아이디: user.아이디,
    담당자명: user.담당자명,
    권한: user.권한,
    exp: Date.now() + SESSION_TTL_MS
  });
  writeSession_(token, payload);
  return token;
}

/**
* 토큰 → 로그인 사용자. 만료/사용중지 계정이면 null.
*/
function getSessionUser_(token) {
  const raw = readSessionRaw_(token);
  if (!raw) return null;
  let sess;
  try { sess = JSON.parse(raw); } catch (e) { return null; }
  if (!sess || !sess.exp || sess.exp < Date.now()) { clearSession_(token); return null; }

  // 사용자 시트의 최신 권한/사용여부 반영
  const users = getAllUsers_();
  const found = users.filter(function (u) {
    return normalizeName_(u.아이디).toLowerCase() === normalizeName_(sess.아이디).toLowerCase();
  })[0];
  if (found && found.사용여부 === 'N') { clearSession_(token); return null; }

  return {
    아이디: found ? found.아이디 : sess.아이디,
    담당자명: found && found.담당자명 ? found.담당자명 : (sess.담당자명 || sess.아이디),
    권한: found ? found.권한 : (sess.권한 || 'STAFF')
  };
}

function requireUser_(token) {
  const user = getSessionUser_(token);
  if (!user) throw new Error('로그인이 필요합니다. 다시 로그인해 주세요.');
  return user;
}

function isMaster_(user) {
  return String((user && user.권한) || '').toUpperCase() === 'MASTER';
}

function requireMaster_(token) {
  const user = requireUser_(token);
  if (!isMaster_(user)) throw new Error('마스터 권한만 사용할 수 있는 기능입니다.');
  return user;
}

/**
* STAFF는 거래처.담당자 === 로그인 사용자 담당자명 인 거래처만 접근 가능
*/
function canAccessClient_(user, client) {
  if (!client) return false;
  if (isMaster_(user)) return true;
  const owner = normalizeName_(client.담당자);
  return owner !== '' && owner === normalizeName_(user.담당자명);
}

/**
* 로그인 + 부트스트랩 데이터 동시 반환
*/
function login(id, pw) {
  const loginId = String(id || '').trim();
  const loginPw = String(pw || '').trim();
  if (!loginId || !loginPw) {
    return { success: false, message: '아이디와 비밀번호를 모두 입력해 주세요.' };
  }

  let users = getAllUsers_();
  if (!users.length) {
    // 사용자 시트가 비어 있으면 기본 계정을 만들어 재시도
    const sheet = getSheet_(SHEET_NAMES.USERS);
    if (sheet.getLastRow() <= 1) {
      sheet.getRange(2, 1, DEFAULT_USERS.length, 5).setValues(DEFAULT_USERS);
    }
    users = getAllUsers_();
  }

  const found = users.filter(function (u) {
    return normalizeName_(u.아이디).toLowerCase() === normalizeName_(loginId).toLowerCase();
  })[0];

  if (!found || found.비밀번호 !== loginPw) {
    return { success: false, message: '아이디 또는 비밀번호가 올바르지 않습니다.' };
  }
  if (found.사용여부 === 'N') {
    return { success: false, message: '사용이 중지된 계정입니다. 마스터에게 문의해 주세요.' };
  }

  const user = {
    아이디: found.아이디,
    담당자명: found.담당자명 || found.아이디,
    권한: found.권한 || 'STAFF'
  };
  const token = createSession_(user);

  return {
    success: true,
    token: token,
    user: user,
    appVersion: APP_VERSION,
    requiresPin: Boolean(getSettingsMap_()['접근PIN']),
    bootstrap: buildBootstrapPayload_(user)
  };
}

function logout(token) {
  clearSession_(token);
  return { success: true };
}

/**
* 로그인 사용자 기준 데이터 묶음
*/
function buildBootstrapPayload_(user) {
  const settings = getSettingsMap_();
  const safeSettings = Object.assign({}, settings);
  delete safeSettings['접근PIN'];       // PIN 원문은 클라이언트에 노출하지 않음
  delete safeSettings['HIRA_API_KEY'];  // API 키도 노출하지 않음

  return {
    user: user,
    isMaster: isMaster_(user),
    appVersion: APP_VERSION,
    requiresPin: Boolean(settings['접근PIN']),
    hiraConfigured: Boolean(settings['HIRA_API_KEY']),
    userEmail: Session.getActiveUser().getEmail() || '',
    settings: safeSettings,
    clients: getClients(true, null, user),
    products: getProducts(),
    elpharmaCount: elpharmaCount_(),
    today: formatDate_(new Date()),
    currentMonth: currentMonth_()
  };
}

/** 이엘파마품목 시트에 실제로 적재된 품목 수 (탭이 없으면 0) */
function elpharmaCount_() {
  try {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAMES.ELPHARMA);
    if (!sheet) return 0;
    return Math.max(0, sheet.getLastRow() - 1);
  } catch (e) {
    return 0;
  }
}

/**
* 앱 새로고침(재접속) 시 사용
*/
function getBootstrapData(token) {
  const user = requireUser_(token);
  return buildBootstrapPayload_(user);
}

/**
* 접근 PIN 검증 (설정의 접근PIN이 비어 있으면 항상 통과)
*/
function verifyPin(inputPin) {
  const settings = getSettingsMap_();
  const savedPin = String(settings['접근PIN'] || '').trim();
  if (!savedPin) return { valid: true };
  return { valid: String(inputPin || '').trim() === savedPin };
}

// ----------------------------------------------------------------------------
// 4. 설정
// ----------------------------------------------------------------------------
function getSettingsMap_() {
  const rows = getAllRowsAsObjects_(SHEET_NAMES.SETTINGS);
  const map = {};
  DEFAULT_SETTINGS.forEach(function (item) {
    map[item[0]] = item[1];
  });
  rows.forEach(function (r) {
    const key = String(r['설정키'] || '').trim();
    if (key) {
      map[key] = r['설정값'] !== undefined && r['설정값'] !== null ? String(r['설정값']).trim() : '';
    }
  });
  return map;
}

/**
* 설정 값 저장 (회전일 공식, 기준일수, 회사명 등) - 마스터 전용
*/
function saveSettings(updates, token) {
  requireMaster_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.SETTINGS);
    const lastRow = sheet.getLastRow();
    const existing = lastRow > 1 ? sheet.getRange(2, 1, lastRow - 1, 3).getValues() : [];
    const keyToRow = {};
    for (let i = 0; i < existing.length; i++) {
      keyToRow[String(existing[i][0]).trim()] = i + 2;
    }

    Object.keys(updates).forEach(function (key) {
      const val = updates[key];
      if (keyToRow[key]) {
        sheet.getRange(keyToRow[key], 2).setValue(val);
      } else {
        sheet.appendRow([key, val, '웹앱에서 추가된 설정']);
      }
    });

    const newSettings = getSettingsMap_();
    delete newSettings['접근PIN'];
    delete newSettings['HIRA_API_KEY'];
    return { success: true, settings: newSettings };
  });
}

/**
* HIRA(공공데이터포털) 키가 등록되어 있는지만 클라이언트에 알려줌
*/
function getHiraKeyStatus(token) {
  requireUser_(token);
  const key = String(getSettingsMap_()['HIRA_API_KEY'] || '').trim();
  return { configured: Boolean(key) };
}

// ----------------------------------------------------------------------------
// 5. MODULE 1: 거래처 등록/관리
// ----------------------------------------------------------------------------
function getClients(includeInactive, token, sessionUser) {
  const user = sessionUser || requireUser_(token);
  const rows = getAllRowsAsObjects_(SHEET_NAMES.CLIENTS);
  return rows.filter(function (r) {
    if (!includeInactive) {
      if (String(r['사용여부'] || 'Y').toUpperCase() === 'N') return false;
    }
    return true;
  }).map(function (r) {
    return {
      _rowIndex: r._rowIndex,
      거래처코드: String(r['거래처코드'] || '').trim(),
      거래처명: String(r['거래처명'] || '').trim(),
      유통구분: String(r['유통구분'] || '의원').trim(),
      사업유형: String(r['사업유형'] || '').trim(),
      진료과: String(r['진료과'] || '').trim(),
      담당자: String(r['담당자'] || '').trim(),
      연락처: String(r['연락처'] || '').trim(),
      이메일: String(r['이메일'] || '').trim(),
      주소: String(r['주소'] || '').trim(),
      회전일경고기준: toNum_(r['회전일경고기준'], 100),
      사용여부: String(r['사용여부'] || 'Y').toUpperCase() === 'N' ? 'N' : 'Y',
      메모: String(r['메모'] || '').trim()
    };
  }).filter(function (c) {
    return canAccessClient_(user, c);
  });
}

function saveClient(payload, token) {
  const user = requireUser_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.CLIENTS);
    // 채번·중복검사는 권한과 무관하게 전체 거래처 기준 (코드는 시트 전체에서 유일해야 함)
    const allRaw = getAllRowsAsObjects_(SHEET_NAMES.CLIENTS).map(function (r) {
      return {
        _rowIndex: r._rowIndex,
        거래처코드: String(r['거래처코드'] || '').trim(),
        담당자: String(r['담당자'] || '').trim()
      };
    });
    let code = String(payload.거래처코드 || '').trim();

    if (!payload.거래처명 || !String(payload.거래처명).trim()) {
      throw new Error('거래처명은 필수 입력 항목입니다.');
    }

    // STAFF는 담당자를 자기 이름으로 고정 (남의 거래처로 바꾸는 것 방지)
    let manager = String(payload.담당자 || '').trim();
    if (!isMaster_(user)) manager = user.담당자명;

    // 신규 등록 시 코드 미입력이면 자동 채번 (C0001 형식)
    if (!code) {
      let maxNum = 0;
      allRaw.forEach(function (c) {
        const m = String(c.거래처코드).match(/^C(\d+)$/i);
        if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
      });
      code = 'C' + String(maxNum + 1).padStart(4, '0');
    }

    if (payload._rowIndex) {
      const target = allRaw.filter(function (r) { return r._rowIndex === Number(payload._rowIndex); })[0];
      if (!target) throw new Error('수정할 거래처를 찾을 수 없습니다.');
      if (!canAccessClient_(user, target)) throw new Error('이 거래처를 수정할 권한이 없습니다.');
    }

    const rowData = {
      '거래처코드': code,
      '거래처명': String(payload.거래처명 || '').trim(),
      '유통구분': String(payload.유통구분 || '의원').trim(),
      '사업유형': String(payload.사업유형 || '').trim(),
      '진료과': String(payload.진료과 || '').trim(),
      '담당자': manager,
      '연락처': String(payload.연락처 || '').trim(),
      '이메일': String(payload.이메일 || '').trim(),
      '주소': String(payload.주소 || '').trim(),
      '회전일경고기준': toNum_(payload.회전일경고기준, 100),
      '사용여부': String(payload.사용여부 || 'Y').toUpperCase() === 'N' ? 'N' : 'Y',
      '메모': String(payload.메모 || '').trim()
    };

    if (payload._rowIndex) {
      writeRowByHeaders_(sheet, rowData, Number(payload._rowIndex));
    } else {
      const dup = allRaw.some(function (c) { return c.거래처코드 === code; });
      if (dup) throw new Error('이미 존재하는 거래처코드입니다: ' + code);
      writeRowByHeaders_(sheet, rowData, null);
    }

    return { success: true, code: code, clients: getClients(true, null, user) };
  });
}

function toggleClientStatus(rowIndex, activeFlag, token) {
  const user = requireUser_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.CLIENTS);
    const status = activeFlag === 'Y' ? 'Y' : 'N';

    const target = getAllRowsAsObjects_(SHEET_NAMES.CLIENTS).filter(function (r) {
      return r._rowIndex === Number(rowIndex);
    })[0];
    if (!target) throw new Error('거래처를 찾을 수 없습니다.');
    if (!canAccessClient_(user, { 담당자: String(target['담당자'] || '').trim() })) {
      throw new Error('이 거래처를 변경할 권한이 없습니다.');
    }

    const statusCol = headerIndex_(sheet, '사용여부', 11);
    sheet.getRange(Number(rowIndex), statusCol).setValue(status);
    return { success: true, clients: getClients(true, null, user) };
  });
}

// ----------------------------------------------------------------------------
// 6. MODULE 2: 제품마스터, 주문(매출)/수금 등록, 회전일 대시보드
// ----------------------------------------------------------------------------
function getProducts() {
  const rows = getAllRowsAsObjects_(SHEET_NAMES.PRODUCTS);
  return rows.map(function (r) {
    return {
      _rowIndex: r._rowIndex,
      보험코드: String(r['보험코드'] || '').trim(),
      제품명: String(r['제품명'] || '').trim(),
      규격: String(r['규격'] || '').trim(),
      기준단가: toNum_(r['기준단가'], 0),
      수수료율: toNum_(r['수수료율'], 0),
      급여구분: normalizePayType_(r['급여구분']),
      시장가: toNum_(r['시장가'], 0)
    };
  });
}

/**
* 급여구분 값 정리 — '급여' / '비급여' 만 남기고 나머지는 빈칸
*/
function normalizePayType_(val) {
  const v = String(val || '').replace(/\s/g, '');
  if (v === '급여') return '급여';
  if (v === '비급여') return '비급여';
  return '';
}

function saveProduct(payload, token) {
  requireMaster_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.PRODUCTS);
    if (!payload.제품명 || !String(payload.제품명).trim()) {
      throw new Error('제품명은 필수입니다.');
    }
    const rowData = {
      '보험코드': String(payload.보험코드 || '').trim(),
      '제품명': String(payload.제품명 || '').trim(),
      '규격': String(payload.규격 || '').trim(),
      '기준단가': toNum_(payload.기준단가, 0),
      '수수료율': toNum_(payload.수수료율, 0),
      '급여구분': normalizePayType_(payload.급여구분),
      '시장가': toNum_(payload.시장가, 0)
    };
    if (payload._rowIndex) {
      writeRowByHeaders_(sheet, rowData, Number(payload._rowIndex));
    } else {
      writeRowByHeaders_(sheet, rowData, null);
    }
    return { success: true, products: getProducts() };
  });
}

function getAllTransactions_() {
  const rows = getAllRowsAsObjects_(SHEET_NAMES.TRANSACTIONS);
  return rows.map(function (r) {
    return {
      _rowIndex: r._rowIndex,
      거래ID: String(r['거래ID'] || '').trim(),
      날짜: formatDate_(r['날짜']),
      구분: String(r['구분'] || '').trim(),
      거래처코드: String(r['거래처코드'] || '').trim(),
      거래처명: String(r['거래처명'] || '').trim(),
      보험코드: String(r['보험코드'] || '').trim(),
      품목명: String(r['품목명'] || '').trim(),
      수량: toNum_(r['수량'], 0),
      단가: toNum_(r['단가'], 0),
      공급가액: toNum_(r['공급가액'], 0),
      부가세: toNum_(r['부가세'], 0),
      합계금액: toNum_(r['합계금액'], 0),
      수금유형: String(r['수금유형'] || '').trim(),
      비고: String(r['비고'] || '').trim()
    };
  });
}

/**
* 권한 필터 통과 거래처코드 집합
*/
function allowedClientCodeMap_(user) {
  const map = {};
  if (isMaster_(user)) return null; // null = 전체 허용
  getClients(true, null, user).forEach(function (c) { map[c.거래처코드] = true; });
  return map;
}

function getRecentTransactions(limit, token) {
  const user = requireUser_(token);
  const allowed = allowedClientCodeMap_(user);
  const list = getAllTransactions_().filter(function (t) {
    return !allowed || allowed[t.거래처코드];
  });
  list.sort(function (a, b) {
    if (a.날짜 !== b.날짜) return b.날짜.localeCompare(a.날짜);
    return b._rowIndex - a._rowIndex;
  });
  return list.slice(0, limit || 50);
}

function addTransaction(payload, token) {
  const user = requireUser_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.TRANSACTIONS);
    const dateStr = formatDate_(payload.날짜 || new Date());
    const type = String(payload.구분 || '').trim();
    if (type !== '매출' && type !== '수금') {
      throw new Error('구분은 매출 또는 수금이어야 합니다.');
    }
    if (!payload.거래처코드 && !payload.거래처명) {
      throw new Error('거래처를 선택해 주세요.');
    }

    const clientCode = String(payload.거래처코드 || '').trim();
    if (!isMaster_(user)) {
      const mine = getClients(true, null, user).filter(function (c) { return c.거래처코드 === clientCode; })[0];
      if (!mine) throw new Error('담당 거래처만 주문을 등록할 수 있습니다.');
    }

    const txId = 'TX' + Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyyMMddHHmmss') +
      Math.floor(Math.random() * 90 + 10);

    let qty = 0, unitPrice = 0, supplyAmt = 0, vatAmt = 0, totalAmt = 0;
    let insCode = '', prodName = '', payType = '';

    if (type === '매출') {
      insCode = String(payload.보험코드 || '').trim();
      prodName = String(payload.품목명 || '').trim();
      qty = toNum_(payload.수량, 0);
      unitPrice = toNum_(payload.단가, 0);
      supplyAmt = payload.공급가액 !== undefined && payload.공급가액 !== ''
        ? toNum_(payload.공급가액, 0)
        : Math.round(qty * unitPrice);
      vatAmt = payload.부가세 !== undefined && payload.부가세 !== ''
        ? toNum_(payload.부가세, 0)
        : Math.round(supplyAmt * 0.1);
      totalAmt = supplyAmt + vatAmt;
    } else {
      totalAmt = toNum_(payload.합계금액, 0);
      supplyAmt = totalAmt;
      vatAmt = 0;
      payType = String(payload.수금유형 || '계좌').trim();
    }

    const rowData = {
      '거래ID': txId,
      '날짜': dateStr,
      '구분': type,
      '거래처코드': clientCode,
      '거래처명': String(payload.거래처명 || '').trim(),
      '보험코드': insCode,
      '품목명': prodName,
      '수량': qty,
      '단가': unitPrice,
      '공급가액': supplyAmt,
      '부가세': vatAmt,
      '합계금액': totalAmt,
      '수금유형': payType,
      '비고': String(payload.비고 || '').trim()
    };

    writeRowByHeaders_(sheet, rowData, null);
    return { success: true, txId: txId };
  });
}

function deleteTransaction(rowIndex, token) {
  const user = requireUser_(token);
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.TRANSACTIONS);
    const idx = Number(rowIndex);
    if (idx <= 1 || idx > sheet.getLastRow()) {
      throw new Error('삭제할 거래 행을 찾을 수 없습니다.');
    }
    if (!isMaster_(user)) {
      const tx = getAllTransactions_().filter(function (t) { return t._rowIndex === idx; })[0];
      const mine = tx ? getClients(true, null, user).filter(function (c) { return c.거래처코드 === tx.거래처코드; })[0] : null;
      if (!mine) throw new Error('담당 거래처의 거래만 삭제할 수 있습니다.');
    }
    sheet.deleteRow(idx);
    return { success: true };
  });
}

/**
* 회전일 대시보드 실시간 집계 (STAFF는 담당 거래처만)
* @param {string} targetMonth 'YYYY-MM' (기본 당월)
* @param {string} overrideFormula 선택 시 설정 오버라이드
* @param {number} overrideBaseDays 선택 시 기준일수 오버라이드
*/
function getTurnoverDashboard(targetMonth, overrideFormula, overrideBaseDays, token) {
  const user = requireUser_(token);
  const settings = getSettingsMap_();
  const formula = overrideFormula || settings['회전일공식'] || 'MONTHLY_30';
  const baseDays = toNum_(overrideBaseDays || settings['회전일기준일수'], 30);
  const defaultWarnDays = toNum_(settings['기본경고회전일'], 100);

  const now = new Date();
  const ym = targetMonth && /^\d{4}-\d{2}$/.test(targetMonth)
    ? targetMonth
    : Utilities.formatDate(now, Session.getScriptTimeZone(), 'yyyy-MM');

  const parts = ym.split('-');
  const year = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10); // 1~12

  const monthStart = ym + '-01';
  const nextMonthDate = new Date(year, month, 1);
  const monthEndDate = new Date(nextMonthDate.getTime() - 86400000);
  const monthEnd = formatDate_(monthEndDate);

  // 최근 3개월 시작일 (해당월 포함 직전 2개월 1일)
  const threeMonthsAgoDate = new Date(year, month - 3, 1);
  const threeMonthsStart = formatDate_(threeMonthsAgoDate);

  // 최근 90일 시작일
  const ninetyDaysAgoDate = new Date(monthEndDate.getTime() - 89 * 86400000);
  const ninetyDaysStart = formatDate_(ninetyDaysAgoDate);

  const clients = getClients(false, null, user); // 사용중 + 권한 내 거래처만
  const txs = getAllTransactions_();

  const statsMap = {};
  clients.forEach(function (c) {
    statsMap[c.거래처코드] = {
      거래처코드: c.거래처코드,
      거래처명: c.거래처명,
      유통구분: c.유통구분,
      담당자: c.담당자,
      연락처: c.연락처,
      이메일: c.이메일,
      회전일경고기준: c.회전일경고기준 || defaultWarnDays,
      전월말잔고: 0,
      당월매출: 0,
      당월수금: 0,
      최근3개월매출: 0,
      최근90일매출: 0,
      현재잔고: 0,
      회전일: 0,
      경고여부: false
    };
  });

  txs.forEach(function (t) {
    const s = statsMap[t.거래처코드];
    if (!s || !t.날짜) return;
    if (t.날짜 > monthEnd) return; // 조회 기준월 이후 거래 제외

    const amt = t.합계금액;
    const isSale = t.구분 === '매출';

    if (t.날짜 < monthStart) {
      s.전월말잔고 += isSale ? amt : -amt;
    } else if (t.날짜 >= monthStart && t.날짜 <= monthEnd) {
      if (isSale) s.당월매출 += amt;
      else s.당월수금 += amt;
    }

    if (isSale && t.날짜 >= threeMonthsStart && t.날짜 <= monthEnd) {
      s.최근3개월매출 += amt;
    }
    if (isSale && t.날짜 >= ninetyDaysStart && t.날짜 <= monthEnd) {
      s.최근90일매출 += amt;
    }
  });

  const rows = [];
  let sumPrev = 0, sumSales = 0, sumColl = 0, sumBal = 0, warnCount = 0;

  Object.keys(statsMap).forEach(function (code) {
    const s = statsMap[code];
    s.현재잔고 = s.전월말잔고 + s.당월매출 - s.당월수금;

    let turnover = 0;
    if (s.현재잔고 <= 0) {
      turnover = 0;
    } else if (formula === 'AVG_3M') {
      const avgMonthly = s.최근3개월매출 / 3;
      turnover = avgMonthly > 0 ? Math.round((s.현재잔고 / avgMonthly) * baseDays) : 999;
    } else if (formula === 'DAYS_90') {
      const dailySales = s.최근90일매출 / 90;
      turnover = dailySales > 0 ? Math.round(s.현재잔고 / dailySales) : 999;
    } else {
      // 기본 MONTHLY_30: 현재잔고 / 당월매출 * 기준일수
      turnover = s.당월매출 > 0 ? Math.round((s.현재잔고 / s.당월매출) * baseDays) : 999;
    }

    s.회전일 = turnover;
    s.경고여부 = s.현재잔고 > 0 && turnover >= s.회전일경고기준;

    sumPrev += s.전월말잔고;
    sumSales += s.당월매출;
    sumColl += s.당월수금;
    sumBal += s.현재잔고;
    if (s.경고여부) warnCount++;

    rows.push(s);
  });

  // 회전일 높은 순(경고 거래처 우선) 정렬
  rows.sort(function (a, b) {
    if (a.경고여부 !== b.경고여부) return a.경고여부 ? -1 : 1;
    if (b.회전일 !== a.회전일) return b.회전일 - a.회전일;
    return b.현재잔고 - a.현재잔고;
  });

  return {
    targetMonth: ym,
    formula: formula,
    baseDays: baseDays,
    defaultWarnDays: defaultWarnDays,
    summary: {
      totalClients: rows.length,
      warnCount: warnCount,
      sumPrev: sumPrev,
      sumSales: sumSales,
      sumColl: sumColl,
      sumBal: sumBal
    },
    rows: rows
  };
}

// ----------------------------------------------------------------------------
// 7. MODULE 3: 거래원장 및 거래명세서 조회
// ----------------------------------------------------------------------------
function getLedgerData(clientCode, startDate, endDate, token) {
  const user = requireUser_(token);
  if (!clientCode) throw new Error('거래처를 선택해 주세요.');
  const client = getClients(true, null, user).filter(function (c) { return c.거래처코드 === clientCode; })[0];
  if (!client) throw new Error('선택한 거래처를 찾을 수 없거나 접근 권한이 없습니다.');

  const sDate = formatDate_(startDate);
  const eDate = formatDate_(endDate);
  const txs = getAllTransactions_().filter(function (t) {
    return t.거래처코드 === clientCode && t.날짜;
  });

  txs.sort(function (a, b) {
    if (a.날짜 !== b.날짜) return a.날짜.localeCompare(b.날짜);
    return a._rowIndex - b._rowIndex;
  });

  let carryOver = 0;
  let runningBalance = 0;
  let periodSales = 0;
  let periodCollections = 0;
  let periodSupply = 0;
  let periodVat = 0;
  const ledgerRows = [];
  const statementRows = [];

  txs.forEach(function (t) {
    const isSale = t.구분 === '매출';
    if (sDate && t.날짜 < sDate) {
      carryOver += isSale ? t.합계금액 : -t.합계금액;
      return;
    }
    if (eDate && t.날짜 > eDate) {
      return;
    }

    if (ledgerRows.length === 0) {
      runningBalance = carryOver;
    }

    if (isSale) {
      runningBalance += t.합계금액;
      periodSales += t.합계금액;
      periodSupply += t.공급가액;
      periodVat += t.부가세;
      statementRows.push(t);
    } else {
      runningBalance -= t.합계금액;
      periodCollections += t.합계금액;
    }

    ledgerRows.push({
      거래ID: t.거래ID,
      날짜: t.날짜,
      구분: t.구분,
      적요: isSale
        ? (t.품목명 + (t.수량 ? ' (' + t.수량 + '개)' : ''))
        : ('수금 - ' + (t.수금유형 || '기타')),
      매출액: isSale ? t.합계금액 : 0,
      수금액: isSale ? 0 : t.합계금액,
      누적잔액: runningBalance,
      비고: t.비고
    });
  });

  const endingBalance = ledgerRows.length > 0 ? runningBalance : carryOver;

  return {
    client: client,
    startDate: sDate,
    endDate: eDate,
    carryOver: carryOver,
    periodSales: periodSales,
    periodCollections: periodCollections,
    periodSupply: periodSupply,
    periodVat: periodVat,
    endingBalance: endingBalance,
    ledgerRows: ledgerRows,
    statementRows: statementRows
  };
}

// ----------------------------------------------------------------------------
// 8. MODULE 4: 거래처 상세정보 · 다처방(다빈도 주문) 순위 · 지난 주문
// ----------------------------------------------------------------------------
/**
* 거래내역을 품목별로 집계해 수량·금액 순위를 만듭니다.
*/
function aggregateTopItems_(txs, limit) {
  const map = {};
  txs.forEach(function (t) {
    if (t.구분 !== '매출') return;
    const name = String(t.품목명 || '').trim();
    if (!name) return;
    const key = String(t.보험코드 || '') + '|' + name;
    if (!map[key]) {
      map[key] = {
        보험코드: t.보험코드 || '',
        품목명: name,
        수량: 0,
        금액: 0,
        건수: 0,
        최근주문일: t.날짜 || ''
      };
    }
    const m = map[key];
    m.수량 += t.수량 || 0;
    m.금액 += (t.공급가액 || (t.합계금액 - t.부가세) || 0);
    m.건수 += 1;
    if (t.날짜 && t.날짜 > m.최근주문일) m.최근주문일 = t.날짜;
  });

  const arr = Object.keys(map).map(function (k) { return map[k]; });
  const byQty = arr.slice().sort(function (a, b) {
    if (b.수량 !== a.수량) return b.수량 - a.수량;
    return b.금액 - a.금액;
  });
  const byAmount = arr.slice().sort(function (a, b) {
    if (b.금액 !== a.금액) return b.금액 - a.금액;
    return b.수량 - a.수량;
  });
  const n = limit || 5;
  return { topByQty: byQty.slice(0, n), topByAmount: byAmount.slice(0, n), itemCount: arr.length };
}

/**
* 거래처 상세정보 모달용 묶음 데이터
*/
function getClientDetail(clientCode, token) {
  const user = requireUser_(token);
  const code = String(clientCode || '').trim();
  const client = getClients(true, null, user).filter(function (c) { return c.거래처코드 === code; })[0];
  if (!client) throw new Error('거래처를 찾을 수 없거나 접근 권한이 없습니다.');

  const txs = getAllTransactions_().filter(function (t) { return t.거래처코드 === code; });
  txs.sort(function (a, b) {
    if (a.날짜 !== b.날짜) return b.날짜.localeCompare(a.날짜);
    return b._rowIndex - a._rowIndex;
  });

  const ym = currentMonth_();
  let balance = 0, monthSales = 0, monthColl = 0, totalSales = 0, lastOrderDate = '', saleCount = 0;

  txs.forEach(function (t) {
    const isSale = t.구분 === '매출';
    balance += isSale ? t.합계금액 : -t.합계금액;
    if (isSale) {
      totalSales += t.합계금액;
      saleCount += 1;
      if (t.날짜 && t.날짜 > lastOrderDate) lastOrderDate = t.날짜;
    }
    if (t.날짜 && t.날짜.slice(0, 7) === ym) {
      if (isSale) monthSales += t.합계금액;
      else monthColl += t.합계금액;
    }
  });

  return {
    client: client,
    summary: {
      현재잔고: balance,
      당월매출: monthSales,
      당월수금: monthColl,
      누적매출: totalSales,
      주문건수: saleCount,
      최근주문일: lastOrderDate || '-',
      회전일경고기준: client.회전일경고기준
    },
    topItems: aggregateTopItems_(txs, 5),
    recentTx: txs.slice(0, 15),
    hiraSearchUrl: 'https://www.hira.or.kr/ra/hosp/getHealthMap.do'
  };
}

/**
* 주문 등록 화면용 '지난 주문 내역' (최근 매출 건, 최신순)
*/
function getRecentOrdersByClient(clientCode, limit, token) {
  const user = requireUser_(token);
  const code = String(clientCode || '').trim();
  if (!code) return { orders: [] };

  const client = getClients(true, null, user).filter(function (c) { return c.거래처코드 === code; })[0];
  if (!client) throw new Error('거래처를 찾을 수 없거나 접근 권한이 없습니다.');

  const orders = getAllTransactions_().filter(function (t) {
    return t.거래처코드 === code && t.구분 === '매출';
  });
  orders.sort(function (a, b) {
    if (a.날짜 !== b.날짜) return b.날짜.localeCompare(a.날짜);
    return b._rowIndex - a._rowIndex;
  });

  return {
    clientCode: code,
    clientName: client.거래처명,
    orders: orders.slice(0, limit || 10),
    totalCount: orders.length
  };
}

// 9. MODULE 5: HIRA(건강보험심사평가원) 요양기관 정보 조회
//    공공데이터포털(data.go.kr) 요양기관기본정보 API - HIRA_API_KEY 필요
// ----------------------------------------------------------------------------
function getHiraHospitalInfo(hospName, token) {
  requireUser_(token);
  const name = String(hospName || '').trim();
  if (!name) return { configured: true, items: [], message: '병원·약국 이름을 입력해 주세요.' };

  const key = String(getSettingsMap_()['HIRA_API_KEY'] || '').trim();
  if (!key) {
    return {
      configured: false,
      items: [],
      message: '설정 탭의 HIRA_API_KEY(공공데이터포털 인증키)를 입력하면 심평원 요양기관 정보를 자동 조회합니다.'
    };
  }

  const url = 'https://apis.data.go.kr/B551182/hospInfoServicev2/getHospBasisList' +
    '?ServiceKey=' + encodeURIComponent(key) +
    '&pageNo=1&numOfRows=10&_type=json&yadmNm=' + encodeURIComponent(name);

  let body;
  try {
    const res = UrlFetchApp.fetch(url, { muteHttpExceptions: true });
    body = res.getContentText();
  } catch (e) {
    return { configured: true, items: [], message: '심평원 API 호출에 실패했습니다: ' + e.message };
  }

  let resultCode = '00';
  let resultMsg = '';
  let rawItems = [];

  let json = null;
  try { json = JSON.parse(body); } catch (e) { json = null; }

  if (json) {
    const header = json && json.response && json.response.header;
    resultCode = header ? String(header.resultCode) : '00';
    resultMsg = header ? String(header.resultMsg || '') : '';
    rawItems = json && json.response && json.response.body && json.response.body.items
      ? (json.response.body.items.item || [])
      : [];
    if (!Array.isArray(rawItems)) rawItems = rawItems ? [rawItems] : [];
  } else {
    // 공공데이터포털이 XML로 답하는 경우(기본 응답 형식) 대비
    let xml = null;
    try { xml = parseHiraXml_(body); } catch (e) { xml = null; }
    if (!xml) {
      return { configured: true, items: [], message: '심평원 API 응답을 해석하지 못했습니다. 인증키를 확인해 주세요.' };
    }
    resultCode = xml.resultCode || '00';
    resultMsg = xml.resultMsg || '';
    rawItems = xml.items || [];
  }

  if (resultCode !== '00') {
    return { configured: true, items: [], message: '심평원 API 오류(' + resultCode + '): ' + (resultMsg || '인증키/활용신청 상태를 확인해 주세요.') };
  }

  return {
    configured: true,
    items: rawItems.map(mapHiraItem_),
    message: rawItems.length ? '' : '조회 결과가 없습니다.'
  };
}

function mapHiraItem_(it) {
  return {
    요양기관명: it.yadmNm || '',
    종별: it.clCdNm || '',
    시도: it.sidoCdNm || '',
    시군구: it.sgguCdNm || '',
    진료과목: it.dgsbjtCdNm || '',
    의사수: it.drTotCnt !== undefined ? it.drTotCnt : '',
    전화번호: it.telno || '',
    주소: it.addr || '',
    개설일: it.estbDd || '',
    우편번호: it.postNo || '',
    좌표X: it.XPos || '',
    좌표Y: it.YPos || ''
  };
}

/**
* 심평원 API XML 응답 파싱 (resultCode / items)
*/
function parseHiraXml_(body) {
  const doc = XmlService.parse(String(body || ''));
  const root = doc.getRootElement();
  const headerEl = root.getChild('header');
  const bodyEl = root.getChild('body');
  const resultCode = headerEl && headerEl.getChild('resultCode') ? headerEl.getChild('resultCode').getText() : '00';
  const resultMsg = headerEl && headerEl.getChild('resultMsg') ? headerEl.getChild('resultMsg').getText() : '';
  const itemsEl = bodyEl ? bodyEl.getChild('items') : null;
  const itemEls = itemsEl ? itemsEl.getChildren('item') : [];
  const items = itemEls.map(function (itemEl) {
    const obj = {};
    itemEl.getChildren().forEach(function (child) {
      obj[child.getName()] = child.getText();
    });
    return obj;
  });
  return { resultCode: String(resultCode), resultMsg: String(resultMsg), items: items };
}

/**
* 미리보기된 HTML을 PDF Blob으로 변환해 GmailApp으로 발송하고 발송이력 시트에 기록
*/
function sendDocumentEmail(payload, token) {
  const user = requireUser_(token);

  const to = String(payload.to || '').trim();
  const subject = String(payload.subject || '').trim();
  const body = String(payload.body || '').trim();
  const clientName = String(payload.clientName || '').trim();
  const docType = String(payload.docType || '거래원장').trim();
  const pdfHtml = String(payload.pdfHtml || '');
  const fileName = String(payload.fileName || (docType + '_' + clientName + '.pdf')).trim();

  if (!to) throw new Error('수신 이메일 주소를 입력해 주세요.');
  if (!subject) throw new Error('이메일 제목을 입력해 주세요.');

  if (!isMaster_(user)) {
    const mine = getClients(true, null, user).some(function (c) { return normalizeName_(c.거래처명) === normalizeName_(clientName); });
    if (!mine) throw new Error('담당 거래처의 문서만 발송할 수 있습니다.');
  }

  const settings = getSettingsMap_();
  const senderName = settings['회사명'] || '수메디팜';
  let resultMsg = '발송성공';

  try {
    const fullHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' +
      'body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:11px;color:#111;margin:20px;}' +
      'h1{font-size:18px;margin:0 0 8px 0;color:#1e3a5f;}' +
      '.meta{width:100%;border-collapse:collapse;margin-bottom:14px;}' +
      '.meta td{padding:5px 8px;border:1px solid #cbd5e1;font-size:11px;}' +
      '.meta .lbl{background:#f1f5f9;font-weight:bold;width:16%;}' +
      'table.data{width:100%;border-collapse:collapse;margin-top:8px;}' +
      'table.data th{background:#1e3a5f;color:#fff;padding:6px 5px;border:1px solid #1e3a5f;font-size:10.5px;}' +
      'table.data td{padding:5px;border:1px solid #cbd5e1;font-size:10.5px;}' +
      '.num{text-align:right;font-variant-numeric:tabular-nums;}' +
      '.center{text-align:center;}' +
      '.tot{background:#f8fafc;font-weight:bold;}' +
      '.danger{color:#dc2626;font-weight:bold;}' +
      '</style></head><body>' + pdfHtml + '</body></html>';

    const pdfBlob = Utilities.newBlob(fullHtml, 'text/html', 'document.html')
      .getAs('application/pdf')
      .setName(fileName.endsWith('.pdf') ? fileName : fileName + '.pdf');

    GmailApp.sendEmail(to, subject, body, {
      name: senderName,
      attachments: [pdfBlob]
    });
  } catch (err) {
    resultMsg = '실패: ' + err.message;
    recordMailLog_(clientName, to, subject, resultMsg, docType);
    throw new Error('이메일 발송 중 오류가 발생했습니다: ' + err.message);
  }

  recordMailLog_(clientName, to, subject, resultMsg, docType);
  return { success: true, message: '이메일이 정상 발송되었습니다.', logs: getMailLogs(50, token) };
}

function recordMailLog_(clientName, to, subject, result, docType) {
  withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.MAIL_LOGS);
    sheet.appendRow([
      formatDateTime_(new Date()),
      clientName,
      to,
      subject,
      result,
      docType
    ]);
  });
}

// ----------------------------------------------------------------------------
// 11-B. MODULE 7: 담당자별 월별 매출 · 수금 실적
//    MASTER → 전체 담당자 합계 + 담당자별 표 + 담당자 필터
//    STAFF  → 본인 담당 거래처의 실적만 (타 담당자 실적 노출 금지)
// ----------------------------------------------------------------------------
/**
* @param {string} targetMonth 'YYYY-MM' (기본 당월)
* @param {number} monthsBack 추이로 볼 개월 수 (기본 6, 최대 24)
* @param {string} managerFilter 담당자명 (MASTER 전용, 비우면 전체)
*/
function getMonthlyPerformance(targetMonth, monthsBack, managerFilter, token) {
  const user = requireUser_(token);
  const tz = Session.getScriptTimeZone();
  const ym = /^\d{4}-\d{2}$/.test(String(targetMonth || '')) ? String(targetMonth) : currentMonth_();
  const back = Math.min(24, Math.max(1, toNum_(monthsBack, 6)));

  const y = parseInt(ym.slice(0, 4), 10);
  const mo = parseInt(ym.slice(5, 7), 10);
  const months = [];
  for (let i = back - 1; i >= 0; i--) {
    months.push(Utilities.formatDate(new Date(y, mo - 1 - i, 1), tz, 'yyyy-MM'));
  }
  const monthEnd = formatDate_(new Date(new Date(y, mo, 1).getTime() - 86400000));
  const curMonth = months[months.length - 1];

  function emptyCell() {
    return { 매출합계: 0, 매출공급가: 0, 매출건수: 0, 수금합계: 0, 수금건수: 0 };
  }

  // STAFF 는 getClients 가 본인 담당 거래처만 돌려줍니다(= 권한 필터).
  const clients = getClients(true, null, user);
  const clientMap = {};
  const buckets = {};
  function bucketOf(mgr) {
    if (!buckets[mgr]) buckets[mgr] = { 담당자: mgr, months: {}, 누적매출: 0, 누적수금: 0, clients: {} };
    return buckets[mgr];
  }
  clients.forEach(function (c) {
    clientMap[c.거래처코드] = c;
    const mgr = String(c.담당자 || '').trim() || '(담당자 없음)';
    const b = bucketOf(mgr);
    if (c.사용여부 !== 'N') b.clients[c.거래처코드] = true;
  });

  const txs = getAllTransactions_();
  txs.forEach(function (t) {
    if (!t.날짜 || t.날짜 > monthEnd) return;
    const client = clientMap[t.거래처코드];
    if (!client) return;
    const mgr = String(client.담당자 || '').trim() || '(담당자 없음)';
    const b = bucketOf(mgr);
    const isSale = t.구분 === '매출';
    if (isSale) b.누적매출 += t.합계금액; else b.누적수금 += t.합계금액;

    const m = String(t.날짜).slice(0, 7);
    if (months.indexOf(m) === -1) return;
    if (!b.months[m]) b.months[m] = emptyCell();
    const cell = b.months[m];
    if (isSale) {
      cell.매출합계 += t.합계금액;
      cell.매출공급가 += t.공급가액;
      cell.매출건수 += 1;
    } else {
      cell.수금합계 += t.합계금액;
      cell.수금건수 += 1;
    }
  });

  const wanted = String(managerFilter || '').trim();
  const rows = [];
  Object.keys(buckets).forEach(function (mgr) {
    if (wanted && mgr !== wanted) return;
    const b = buckets[mgr];
    const series = months.map(function (m) {
      const c = b.months[m] || emptyCell();
      return {
        month: m,
        매출합계: c.매출합계, 매출공급가: c.매출공급가, 매출건수: c.매출건수,
        수금합계: c.수금합계, 수금건수: c.수금건수
      };
    });
    const cur = series[series.length - 1];
    const prev = series.length > 1 ? series[series.length - 2] : null;
    const prevSales = prev ? prev.매출합계 : 0;
    rows.push({
      담당자: mgr,
      거래처수: Object.keys(b.clients).length,
      당월: cur,
      전월매출: prevSales,
      전월대비: prevSales > 0 ? Math.round(((cur.매출합계 - prevSales) / prevSales) * 1000) / 10 : null,
      미수금: b.누적매출 - b.누적수금,
      series: series
    });
  });
  rows.sort(function (a, b) { return b.당월.매출합계 - a.당월.매출합계; });

  // 전체 합계(보이는 담당자 기준)
  const totalsSeries = months.map(function (m) {
    const cell = emptyCell();
    rows.forEach(function (r) {
      const c = r.series.filter(function (s) { return s.month === m; })[0];
      if (!c) return;
      cell.매출합계 += c.매출합계; cell.매출공급가 += c.매출공급가; cell.매출건수 += c.매출건수;
      cell.수금합계 += c.수금합계; cell.수금건수 += c.수금건수;
    });
    cell.month = m;
    return cell;
  });
  const curTot = totalsSeries[totalsSeries.length - 1];
  const prevTot = totalsSeries.length > 1 ? totalsSeries[totalsSeries.length - 2] : null;

  // 병원별 당월 실적 (담당자 화면에서 펼쳐 보기)
  const clientStats = {};
  clients.forEach(function (c) {
    clientStats[c.거래처코드] = {
      거래처코드: c.거래처코드, 거래처명: c.거래처명, 담당자: c.담당자, 유통구분: c.유통구분,
      매출합계: 0, 매출공급가: 0, 매출건수: 0, 수금합계: 0, 수금건수: 0, 미수금: 0, 사용여부: c.사용여부
    };
  });
  txs.forEach(function (t) {
    if (!t.날짜 || t.날짜 > monthEnd) return;
    const s = clientStats[t.거래처코드];
    if (!s) return;
    const isSale = t.구분 === '매출';
    s.미수금 += isSale ? t.합계금액 : -t.합계금액;
    if (String(t.날짜).slice(0, 7) !== curMonth) return;
    if (isSale) { s.매출합계 += t.합계금액; s.매출공급가 += t.공급가액; s.매출건수 += 1; }
    else { s.수금합계 += t.합계금액; s.수금건수 += 1; }
  });
  const clientRows = Object.keys(clientStats).map(function (k) { return clientStats[k]; })
    .filter(function (s) { return !wanted || String(s.담당자 || '').trim() === wanted; })
    .sort(function (a, b) { return (b.매출합계 - a.매출합계) || a.거래처명.localeCompare(b.거래처명); });

  return {
    targetMonth: ym,
    monthEnd: monthEnd,
    months: months,
    isMaster: isMaster_(user),
    managerFilter: wanted,
    managers: rows,
    totals: {
      거래처수: clients.filter(function (c) { return c.사용여부 !== 'N'; }).length,
      당월: curTot,
      전월매출: prevTot ? prevTot.매출합계 : 0,
      전월대비: prevTot && prevTot.매출합계 > 0
        ? Math.round(((curTot.매출합계 - prevTot.매출합계) / prevTot.매출합계) * 1000) / 10
        : null,
      미수금: rows.reduce(function (sum, r) { return sum + r.미수금; }, 0),
      series: totalsSeries
    },
    clients: clientRows
  };
}

/**
* 이엘파마 9,106품목 서버 검색 (품목명·보험코드·제약사·성분명·분류)
* @param {string} query 검색어 (2글자 이상 권장)
* @param {number} limit 최대 건수 (기본 30, 최대 50)
*/
function searchElpharmaProducts(query, limit, token) {
  requireUser_(token);
  const raw = String(query || '').trim();
  const q = raw.toLowerCase().replace(/\s+/g, '');
  if (!q) return { query: raw, items: [], total: 0, needMore: true };

  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAMES.ELPHARMA);
  const lastRow = sheet ? sheet.getLastRow() : 0;
  if (!sheet || lastRow <= 1) {
    return { query: raw, items: [], total: 0, empty: true, message: '이엘파마품목 시트가 비어 있습니다.' };
  }

  const values = sheet.getRange(2, 1, lastRow - 1, 10).getValues();
  const hits = [];
  for (let i = 0; i < values.length; i++) {
    const row = values[i];
    const code = String(row[0] || '').trim();
    if (!code) continue;
    const name = String(row[1] || '').trim();
    const nName = name.toLowerCase().replace(/\s+/g, '');
    let rank = -1;
    if (nName.indexOf(q) === 0) rank = 0;
    else if (nName.indexOf(q) !== -1) rank = 1;
    else if (code.indexOf(q) === 0) rank = 2;
    else if (code.indexOf(q) !== -1) rank = 3;
    else if (String(row[3] || '').toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1) rank = 4;
    else if (String(row[2] || '').toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1) rank = 5;
    else if (String(row[8] || '').toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1) rank = 6;
    if (rank < 0) continue;
    hits.push({ rank: rank, name: name, item: normalizeElpharmaItem_(row) });
  }

  hits.sort(function (a, b) {
    if (a.rank !== b.rank) return a.rank - b.rank;
    if (a.name.length !== b.name.length) return a.name.length - b.name.length;
    return a.name.localeCompare(b.name);
  });

  const n = Math.min(50, Math.max(1, toNum_(limit, 30)));
  return {
    query: raw,
    total: hits.length,
    items: hits.slice(0, n).map(function (h) {
      const it = h.item;
      it.규격 = extractSpec_(it.품목명);
      return it;
    })
  };
}

/**
* 지금까지 처방 입력에 쓰인 품목(전체) — 기기와 상관없이 서버에 남는 히스토리
* (품목 정보만 돌려주며 거래처·금액 정보는 포함하지 않음)
*/
function getFrequentElpharmaProducts(limit, token) {
  requireUser_(token);
  const rows = getAllRowsAsObjects_(SHEET_NAMES.PRESCRIPTIONS);
  const map = {};
  rows.forEach(function (r) {
    const code = String(r['보험코드'] || '').trim();
    if (!code) return;
    if (!map[code]) {
      map[code] = {
        보험코드: code,
        품목명: String(r['품목명'] || '').trim(),
        규격: String(r['규격'] || '').trim(),
        제약사: String(r['제약사'] || '').trim(),
        약가: toNum_(r['약가'], 0),
        수수료율: toNum_(r['수수료율'], 0),
        사용횟수: 0,
        총수량: 0,
        최근사용: ''
      };
    }
    const m = map[code];
    m.사용횟수 += 1;
    m.총수량 += toNum_(r['수량'], 0);
    const d = String(r['처방일'] || r['기준월'] || '');
    if (d > m.최근사용) m.최근사용 = d;
    if (!m.약가) m.약가 = toNum_(r['약가'], 0);
    if (!m.수수료율) m.수수료율 = toNum_(r['수수료율'], 0);
  });
  const arr = Object.keys(map).map(function (k) { return map[k]; });
  arr.sort(function (a, b) {
    if (b.사용횟수 !== a.사용횟수) return b.사용횟수 - a.사용횟수;
    return String(b.최근사용).localeCompare(String(a.최근사용));
  });
  const n = Math.min(100, Math.max(1, toNum_(limit, 40)));
  return { items: arr.slice(0, n), total: arr.length };
}

/**
* 병원별 빠른 입력 품목 — 이 병원에 한 번이라도 처방 입력한 품목(최근 사용 순)
* 다음 입력 때 이 목록이 화면에 먼저 펼쳐지고 수량만 입력하면 됩니다.
*/
function getPrescriptionQuickItems(clientCode, token) {
  const user = requireUser_(token);
  const code = String(clientCode || '').trim();
  const client = code ? getClients(true, null, user).filter(function (c) { return c.거래처코드 === code; })[0] : null;
  if (code && !client) throw new Error('거래처를 찾을 수 없거나 접근 권한이 없습니다.');

  const rows = getAllRowsAsObjects_(SHEET_NAMES.PRESCRIPTIONS);
  const map = {};
  rows.forEach(function (r) {
    if (String(r['거래처코드'] || '').trim() !== code) return;
    const bc = String(r['보험코드'] || '').trim();
    if (!bc) return;
    if (!map[bc]) {
      map[bc] = {
        보험코드: bc,
        품목명: String(r['품목명'] || '').trim(),
        규격: String(r['규격'] || '').trim(),
        제약사: String(r['제약사'] || '').trim(),
        약가: toNum_(r['약가'], 0),
        수수료율: toNum_(r['수수료율'], 0),
        사용횟수: 0,
        총수량: 0,
        최근월: '',
        최근수량: 0,
        최근처방일: ''
      };
    }
    const m = map[bc];
    m.사용횟수 += 1;
    m.총수량 += toNum_(r['수량'], 0);
    const ym = String(r['기준월'] || '');
    const qty = toNum_(r['수량'], 0);
    if (ym > m.최근월) {
      m.최근월 = ym;
      m.최근수량 = qty;
    } else if (ym === m.최근월) {
      m.최근수량 += qty;
    }
    const d = String(r['처방일'] || ym);
    if (d > m.최근처방일) m.최근처방일 = d;
    m.약가 = toNum_(r['약가'], 0) || m.약가;
    m.수수료율 = toNum_(r['수수료율'], 0) || m.수수료율;
  });
  const arr = Object.keys(map).map(function (k) { return map[k]; });
  arr.sort(function (a, b) {
    if (a.최근월 !== b.최근월) return String(b.최근월).localeCompare(String(a.최근월));
    if (b.사용횟수 !== a.사용횟수) return b.사용횟수 - a.사용횟수;
    return a.품목명.localeCompare(b.품목명);
  });
  return {
    clientCode: code,
    clientName: client ? client.거래처명 : '',
    items: arr,
    total: arr.length
  };
}

function normalizePrescriptionRow_(r) {
  return {
    _rowIndex: r._rowIndex,
    처방ID: String(r['처방ID'] || '').trim(),
    기준월: String(r['기준월'] || '').trim(),
    처방일: formatDate_(r['처방일']),
    거래처코드: String(r['거래처코드'] || '').trim(),
    거래처명: String(r['거래처명'] || '').trim(),
    담당자: String(r['담당자'] || '').trim(),
    제약사: String(r['제약사'] || '').trim(),
    보험코드: String(r['보험코드'] || '').trim(),
    품목명: String(r['품목명'] || '').trim(),
    규격: String(r['규격'] || '').trim(),
    약가: toNum_(r['약가'], 0),
    수량: toNum_(r['수량'], 0),
    처방금액: toNum_(r['처방금액'], 0),
    수수료율: toNum_(r['수수료율'], 0),
    예상수수료: toNum_(r['예상수수료'], 0),
    비고: String(r['비고'] || '').trim(),
    등록일시: String(r['등록일시'] || '').trim()
  };
}

/**
* 처방내역 조회 (기준월 · 거래처별) — STAFF 는 본인 담당 거래처만
* @param {string} month 'YYYY-MM' (기본 당월)
* @param {string} clientCode 비우면 권한 내 전체 거래처
*/
function getPrescriptions(month, clientCode, token) {
  const user = requireUser_(token);
  const ym = /^\d{4}-\d{2}$/.test(String(month || '')) ? String(month) : currentMonth_();
  const code = String(clientCode || '').trim();
  const allowed = allowedClientCodeMap_(user); // null = 전체 허용(MASTER)
  if (code && allowed && !allowed[code]) throw new Error('이 거래처를 조회할 권한이 없습니다.');

  const rows = getAllRowsAsObjects_(SHEET_NAMES.PRESCRIPTIONS)
    .map(normalizePrescriptionRow_)
    .filter(function (r) {
      if (code && r.거래처코드 !== code) return false;
      if (allowed && !allowed[r.거래처코드]) return false;
      if (ym && r.기준월 !== ym) return false;
      return true;
    });

  rows.sort(function (a, b) {
    if (a.거래처명 !== b.거래처명) return a.거래처명.localeCompare(b.거래처명);
    return a.품목명.localeCompare(b.품목명);
  });

  const byClientMap = {};
  let sumAmount = 0, sumFee = 0;
  rows.forEach(function (r) {
    sumAmount += r.처방금액;
    sumFee += r.예상수수료;
    if (!byClientMap[r.거래처코드]) {
      byClientMap[r.거래처코드] = {
        거래처코드: r.거래처코드, 거래처명: r.거래처명, 담당자: r.담당자,
        품목수: 0, 수량합: 0, 처방금액: 0, 예상수수료: 0
      };
    }
    const b = byClientMap[r.거래처코드];
    b.품목수 += 1;
    b.수량합 += r.수량;
    b.처방금액 += r.처방금액;
    b.예상수수료 += r.예상수수료;
  });
  const byClient = Object.keys(byClientMap).map(function (k) { return byClientMap[k]; })
    .sort(function (a, b) { return b.예상수수료 - a.예상수수료; });

  return {
    기준월: ym,
    clientCode: code,
    rows: rows,
    summary: {
      건수: rows.length,
      거래처수: byClient.length,
      처방금액: sumAmount,
      예상수수료: sumFee
    },
    byClient: byClient
  };
}

/**
* 처방내역 일괄 저장 — 같은 병원·같은 달·같은 품목이 있으면 수량만 갱신(중복 생성 없음)
* payload = { 기준월, 처방일, 거래처코드, items: [{보험코드, 품목명, 규격, 제약사, 약가, 수량, 수수료율, 비고}] }
*/
function savePrescriptions(payload, token) {
  const user = requireUser_(token);
  const p = payload || {};
  const ym = /^\d{4}-\d{2}$/.test(String(p['기준월'] || '')) ? String(p['기준월']) : currentMonth_();
  const clientCode = String(p['거래처코드'] || '').trim();
  if (!clientCode) throw new Error('병원(거래처)을 선택해 주세요.');

  const client = getClients(true, null, user).filter(function (c) { return c.거래처코드 === clientCode; })[0];
  if (!client) throw new Error('거래처를 찾을 수 없거나 접근 권한이 없습니다.');

  const items = Array.isArray(p['items']) ? p['items'] : [];
  if (!items.length) throw new Error('저장할 품목이 없습니다.');
  const 처방일 = formatDate_(p['처방일'] || new Date());

  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.PRESCRIPTIONS);
    const existing = getAllRowsAsObjects_(SHEET_NAMES.PRESCRIPTIONS);
    const index = {};
    const usedIds = {};
    existing.forEach(function (r) {
      const key = String(r['기준월'] || '') + '|' + String(r['거래처코드'] || '').trim() + '|' + String(r['보험코드'] || '').trim();
      const id = String(r['처방ID'] || '').trim();
      index[key] = { _rowIndex: r._rowIndex, 처방ID: id, 등록일시: String(r['등록일시'] || '').trim() };
      if (id) usedIds[id] = true;
    });

    // 처방ID 는 삭제·수정의 열쇠라 중복이 나면 안 됩니다 (같은 초에 여러 품목 저장 시).
    function newPrescriptionId_() {
      let id = '';
      do {
        id = 'RX' + Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyyMMddHHmmss') +
          String(Math.floor(Math.random() * 9000) + 1000);
      } while (usedIds[id]);
      usedIds[id] = true;
      return id;
    }

    let created = 0, updated = 0, skipped = 0;
    items.forEach(function (it) {
      const bc = String(it['보험코드'] || '').trim();
      const name = String(it['품목명'] || '').trim();
      const qty = toNum_(it['수량'], 0);
      if (!bc || !name || qty <= 0) { skipped++; return; }

      const price = toNum_(it['약가'], 0);
      const rate = toNum_(it['수수료율'], 0);
      const amount = Math.round(qty * price);
      const fee = Math.round(amount * rate / 100);
      const key = ym + '|' + clientCode + '|' + bc;
      const found = index[key];
      const now = formatDateTime_(new Date());

      const rowData = {
        '처방ID': found && found.처방ID ? found.처방ID : newPrescriptionId_(),
        '기준월': ym,
        '처방일': 처방일,
        '거래처코드': clientCode,
        '거래처명': client.거래처명,
        '담당자': client.담당자,
        '제약사': String(it['제약사'] || '').trim(),
        '보험코드': bc,
        '품목명': name,
        '규격': String(it['규격'] || '').trim() || extractSpec_(name),
        '약가': price,
        '수량': qty,
        '처방금액': amount,
        '수수료율': rate,
        '예상수수료': fee,
        '비고': String(it['비고'] || '').trim(),
        '등록일시': (found && found.등록일시) ? found.등록일시 : now
      };

      if (found) {
        writeRowByHeaders_(sheet, rowData, found._rowIndex);
        rowData['_rowIndex'] = found._rowIndex;
        updated++;
      } else {
        writeRowByHeaders_(sheet, rowData, null);
        created++;
      }
    });

    const result = getPrescriptions(ym, clientCode, token);
    return {
      success: true, created: created, updated: updated, skipped: skipped,
      기준월: ym, clientCode: clientCode, clientName: client.거래처명,
      summary: result.summary, rows: result.rows
    };
  });
}

/** 한 품목만 저장 (하위 호환) */
function savePrescription(payload, token) {
  const p = payload || {};
  const item = p['item'] || p;
  const body = {
    기준월: p['기준월'],
    처방일: p['처방일'],
    거래처코드: p['거래처코드'],
    items: [{
      보험코드: item['보험코드'], 품목명: item['품목명'], 규격: item['규격'], 제약사: item['제약사'],
      약가: item['약가'], 수량: item['수량'], 수수료율: item['수수료율'], 비고: item['비고']
    }]
  };
  return savePrescriptions(body, token);
}

/** 처방내역 1건 삭제 (STAFF 는 본인 담당 거래처만) */
function deletePrescription(id, token) {
  const user = requireUser_(token);
  const pid = String(id || '').trim();
  if (!pid) throw new Error('삭제할 처방을 지정해 주세요.');
  return withLock_(function () {
    const sheet = getSheet_(SHEET_NAMES.PRESCRIPTIONS);
    const rows = getAllRowsAsObjects_(SHEET_NAMES.PRESCRIPTIONS);
    const target = rows.filter(function (r) { return String(r['처방ID'] || '').trim() === pid; })[0];
    if (!target) throw new Error('처방 내역을 찾을 수 없습니다.');
    const code = String(target['거래처코드'] || '').trim();
    const allowed = allowedClientCodeMap_(user);
    if (allowed && !allowed[code]) throw new Error('이 처방을 삭제할 권한이 없습니다.');
    sheet.deleteRow(target._rowIndex);
    return { success: true, id: pid };
  });
}

/** 외부에 열어 둔 서버 함수 목록 (여기에 없는 함수는 호출 불가) */

  };

/** 요청 1건 처리 → {ok:true, result:...} 또는 {ok:false, error:{code,message}} */
function apiHandle_(req) {
  try {
    const fn = String((req && req.fn) || '').trim();
    if (!fn) {
      return { ok: false, error: { code: 'NO_FUNCTION', message: '요청에 fn(함수 이름)이 없습니다.' } };
    }
    const map = apiFunctions_();
    if (!map[fn]) {
      return { ok: false, error: { code: 'NOT_ALLOWED', message: '허용되지 않은 함수입니다: ' + fn } };
    }

    let args = req.args;
    if (typeof args === 'string') {
      try { args = JSON.parse(args); } catch (e) { args = []; }
    }
    if (!Array.isArray(args)) args = [];

    // 모든 공개 함수의 마지막 인자는 로그인 토큰입니다. 비어 있으면 요청의 token 으로 채웁니다.
    const token = String(req.token || '').trim();
    if (token) {
      if (args.length === 0) {
        args.push(token);
      } else if (args[args.length - 1] === '' || args[args.length - 1] === null || args[args.length - 1] === undefined) {
        args[args.length - 1] = token;
      }
    }

    const result = map[fn].apply(null, args);
    return { ok: true, result: result === undefined ? null : result, appVersion: APP_VERSION };
  } catch (err) {
    return { ok: false, error: { code: 'ERROR', message: (err && err.message) ? err.message : String(err) } };
  }
}

/** JSON 또는 JSONP(callback 지정 시) 응답 생성 */
function apiTextOutput_(payload, callback) {
  let json = JSON.stringify(payload);
  const cb = String(callback || '').trim();
  if (cb && /^[A-Za-z_$][A-Za-z0-9_$.]*$/.test(cb)) {
    json = json.replace(/<\//g, '<\\/');   // <\/script> 로 태그가 끊기지 않게
    return ContentService.createTextOutput(cb + '(' + json + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);
}

/** 연결 테스트용 상태 정보 */
function apiStatus_() {
  let ssName = '';
  let sheetNames = [];
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    if (ss) {
      ssName = ss.getName();
      sheetNames = ss.getSheets().map(function (s) { return s.getName(); });
    }
  } catch (e) {}
  return {
    app: 'soomedipharm-crm',
    version: APP_VERSION,
    time: Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm:ss'),
    timezone: Session.getScriptTimeZone(),
    spreadsheet: ssName,
    sheets: sheetNames,
    api: 'post+jsonp'
  };
}
