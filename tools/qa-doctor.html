<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA — 원장님 정보 검색 접기·펼치기 (임시)</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; padding: 10px; background: #f1f5f9; }
  #log { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
  #log .pass { color: #166534; }
  #log .fail { color: #b91c1c; font-weight: 700; }
  iframe { width: 1180px; height: 1100px; border: 1px solid #94a3b8; background: #fff; }
</style>
</head>
<body>
<div id="log">준비 중…</div>
<iframe id="frame" srcdoc=""></iframe>
<script>
/* 임시 QA 페이지 — 라이브 index.html 을 같은 출처 iframe(srcdoc)으로 띄우고
   서버 호출(runServer)만 가짜로 바꿔 접기/펼치기 동작을 확인합니다. 확인 후 삭제합니다. */
(function () {
  var logEl = document.getElementById('log');
  var frame = document.getElementById('frame');
  var lines = [];

  function paint() {
    logEl.innerHTML = lines.map(function (l) {
      return '<div class="' + (l.indexOf('PASS') === 0 ? 'pass' : 'fail') + '">' + l.replace(/</g, '&lt;') + '</div>';
    }).join('') + '<div id="qa-tail">' + (window.__QA_TAIL || '') + '</div>';
  }
  function out(ok, msg, extra) {
    lines.push((ok ? 'PASS' : 'FAIL') + ' — ' + msg + (extra ? '  [' + extra + ']' : ''));
    paint();
  }
  function note(t) { window.__QA_TAIL = t; paint(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function W() { return frame.contentWindow; }
  function D() { return frame.contentDocument; }
  function $(id) { return D().getElementById(id); }
  function txt(id) { var el = $(id); return el ? String(el.textContent || '').trim() : ''; }
  async function waitFor(fn, ms, label) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 10000)) {
      try { if (fn()) return true; } catch (e) {}
      await sleep(120);
    }
    throw new Error('대기 시간 초과: ' + (label || ''));
  }

  /* 가짜 시트 서버 — iframe 안에서 실행되므로 바깥 함수·변수를 쓰지 않고 스스로 완결됩니다. */
  function qaServer(fn, args) {
    fn = String(fn || '');
    var calls = window.__QACalls || (window.__QACalls = {});
    calls[fn] = (calls[fn] || 0) + 1;

    if (!window.__QAClients) {
      var SEED = [
        ['C001', '김가정의원', '내과', '김원장', '051-111-0001', 'a1@clinic.kr', '김도현', '04-08', '홍삼 선호, 커피 X'],
        ['C002', '부산튼튼병원', '정형외과', '박원장', '051-111-0002', 'a2@clinic.kr', '박서준', '11-30', '주말 연락 자제'],
        ['C003', '김해속편한내과', '내과', '이원장', '055-111-0003', 'a3@clinic.kr', '이하늘', '05-02', ''],
        ['C004', '신호약국', '약국', '정약사', '051-111-0004', 'a4@pharm.kr', '', '', ''],
        ['C005', '강서연세의원', '가정의학과', '최원장', '051-111-0005', 'a5@clinic.kr', '최민수', '12-15', '골프'],
        ['C006', '명지이비인후과', '이비인후과', '한원장', '051-111-0006', 'a6@clinic.kr', '', '', ''],
        ['C007', '녹산보건진료소', '내과', '서원장', '051-111-0007', 'a7@clinic.kr', '', '', ''],
        ['C008', '김해미소치과', '치과', '문원장', '055-111-0008', 'a8@clinic.kr', '', '', ''],
        ['C009', '하단중앙의원', '내과', '임원장', '051-111-0009', 'a9@clinic.kr', '', '', ''],
        ['C010', '대저한의원', '한방', '오원장', '051-111-0010', 'a10@clinic.kr', '', '', ''],
        ['C011', '사하약국', '약국', '윤약사', '051-111-0011', 'a11@pharm.kr', '', '', ''],
        ['C012', '수메디팜도매', '도매', '-', '051-111-0012', 'a12@sumedipharm.co.kr', '', '', '']
      ];
      window.__QAClients = SEED.map(function (r, i) {
        return {
          거래처코드: r[0], 거래처명: r[1], 진료과: r[2], 담당자: r[3], 연락처: r[4], 이메일: r[5],
          원장성함: r[6], 원장생일: r[7], 취향: r[8],
          유통구분: (r[2] === '약국' ? '약국' : (r[2] === '도매' ? '도매' : '의원')),
          사용여부: 'Y', 회전일경고기준: 30, _rowIndex: i + 2, 사업자등록번호: '', 사업자등록증URL: ''
        };
      });
    }
    var clients = window.__QAClients;

    if (fn === 'getBootstrapData') {
      return Promise.resolve({
        settings: { '회사명': '수메디팜' }, clients: clients, products: [], elpharmaCount: 0,
        today: '2026-11-29', currentMonth: '2026-11', user: { 아이디: 'qa', 담당자명: 'QA 담당' },
        isMaster: true, appVersion: 'v1.29', hiraConfigured: false
      });
    }
    if (fn === 'searchClientsProfile') {
      var q = String((args && args[0]) || '').trim().toLowerCase();
      var items = clients.filter(function (c) {
        if (!q) return true;
        return (c.거래처명 + ' ' + c.원장성함 + ' ' + c.취향 + ' ' + c.거래처코드).toLowerCase().indexOf(q) !== -1;
      }).map(function (c) {
        var o = {};
        for (var k in c) if (Object.prototype.hasOwnProperty.call(c, k)) o[k] = c[k];
        o.생일까지 = 3;
        return o;
      });
      return Promise.resolve({ items: items, total: items.length });
    }
    if (fn === 'saveClientProfile') {
      var p = (args && args[0]) || {};
      clients.forEach(function (c) {
        if (c.거래처코드 === p.거래처코드) {
          if (typeof p.원장성함 === 'string') c.원장성함 = p.원장성함;
          if (typeof p.원장생일 === 'string') c.원장생일 = p.원장생일;
          if (typeof p.취향 === 'string') c.취향 = p.취향;
        }
      });
      return Promise.resolve({ clients: clients });
    }
    return Promise.resolve({});
  }

  var STUB = [
    'window.__QACalls = {};',
    'window.__QA_SERVER = ' + qaServer.toString() + ';',
    'runServer = function (fnName, args, opts) { try { return window.__QA_SERVER(fnName, args); } catch (e) { return Promise.reject(e); } };',
    'registerServiceWorker = function () {};'
  ].join('\n');

  async function main() {
    note('index.html 내려받는 중…');
    var res = await fetch('../index.html?qa=' + Date.now(), { cache: 'no-store' });
    var html = await res.text();
    note('서버 스텁 심는 중…');

    var guard = '<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String((e&&e.message)||e));});' +
      'window.addEventListener("unhandledrejection",function(e){window.__errs.push("unhandledrejection: "+String((e&&e.reason&&e.reason.message)||(e&&e.reason)||e));});' +
      'var _ce=console.error;console.error=function(){try{window.__errs.push(Array.prototype.join.call(arguments," "));}catch(x){}return _ce.apply(console,arguments);};<\/script>\n<script>';
    var first = html.indexOf('<script>');
    if (first < 0) { out(false, 'index.html 에서 <script> 를 찾지 못했습니다'); return; }
    html = html.slice(0, first) + guard + html.slice(first + '<script>'.length);

    var closeIdx = html.lastIndexOf('<\/script>');
    if (closeIdx < 0) { out(false, 'index.html 에서 닫는 script 태그를 찾지 못했습니다'); return; }
    html = html.slice(0, closeIdx) + '\n' + STUB + '\n' + html.slice(closeIdx);

    try {
      localStorage.setItem('crm_server_url', 'https://script.google.com/macros/s/QA-PLACEHOLDER/exec');
      localStorage.setItem('crm_session_v1', JSON.stringify({ token: 'qa-token', user: { 아이디: 'qa', 담당자명: 'QA 담당' }, isMaster: true }));
    } catch (e) {}

    note('iframe 부팅 중…');
    frame.srcdoc = html;

    await waitFor(function () { return D() && D().readyState === 'complete' && W().__errs; }, 20000, 'iframe 로드');
    await sleep(500);
    W().eval("switchMenu('clients')");
    await waitFor(function () { return $('cp-head'); }, 10000, '거래처 화면');
    await sleep(400);

    var errs = W().__errs;
    out(errs.length === 0, '거래처 화면 부팅 중 런타임 오류 0건', errs.join(' | '));
    out(D().querySelector('.page-title') && D().querySelector('.page-title').textContent.indexOf('거래처 등록 / 관리') !== -1, '거래처 등록/관리 화면이 그려졌다');

    // A. 기본은 접힘
    out($('cp-body').style.display === 'none', '기본: 카드 본문이 접혀 있다');
    out(txt('cp-caret') === '펼치기 ▼', '기본: 버튼 문구가 "펼치기 ▼"', txt('cp-caret'));
    out($('cp-summary').style.display !== 'none', '기본: 접힘 요약이 보인다');
    out(/^전체 \d+곳 · 클릭해서 펼치기$/.test(txt('cp-summary')), '기본: 요약 문구 형식', txt('cp-summary'));
    out(txt('cp-summary') === '전체 12곳 · 클릭해서 펼치기', '기본: 요약의 거래처 수가 맞다', txt('cp-summary'));
    out($('cp-head').getAttribute('aria-expanded') === 'false', '기본: aria-expanded="false"');
    out(D().querySelectorAll('#client-card tr[data-client-item]').length === 12, '기본: 바로 아래 거래처 12곳이 보인다',
      String(D().querySelectorAll('#client-card tr[data-client-item]').length));
    out(!(W().__QACalls['searchClientsProfile'] > 0), '기본(접힘): 원장님 검색 서버 조회를 하지 않는다',
      JSON.stringify(W().__QACalls));

    // B. 펼치기
    $('cp-head').click();
    await waitFor(function () { return $('cp-body').style.display !== 'none'; }, 4000, '펼치기');
    out($('cp-body').style.display !== 'none', '펼치기: 본문이 보인다');
    out(txt('cp-caret') === '접기 ▲', '펼치기: 버튼 문구가 "접기 ▲"', txt('cp-caret'));
    out($('cp-summary').style.display === 'none', '펼치기: 접힘 요약은 숨는다');
    out($('cp-head').getAttribute('aria-expanded') === 'true', '펼치기: aria-expanded="true"');
    await waitFor(function () { return D().querySelector('#cp-result table'); }, 8000, '첫 결과');
    out(true, '펼치기: 결과 표가 그려졌다', '행 ' + D().querySelectorAll('#cp-result tbody tr').length);
    out(W().__QACalls['searchClientsProfile'] === 1, '펼치기: 서버 조회 1회', String(W().__QACalls['searchClientsProfile']));

    // C. 검색어 입력 + 찾기
    var qEl = $('cp-q');
    qEl.value = '김';
    qEl.dispatchEvent(new (W().Event)('input', { bubbles: true }));
    D().querySelector('#cp-body .btn.btn-primary.btn-sm').click();
    await waitFor(function () { return D().querySelectorAll('#cp-result tbody tr').length === 3; }, 8000, '검색 결과 3건');
    out(D().querySelectorAll('#cp-result tbody tr').length === 3, '검색 "김": 결과 3건',
      String(D().querySelectorAll('#cp-result tbody tr').length));
    out($('cp-q').value === '김', '검색 "김": 입력값이 남아 있다', $('cp-q').value);
    out($('cp-body').style.display !== 'none', '검색 "김": 펼침이 유지된다');
    out(txt('cp-caret') === '접기 ▲', '검색 "김": 버튼 문구 유지', txt('cp-caret'));

    // D. 화면을 통째로 다시 그려도(메뉴 재진입) 유지
    W().eval('renderActiveMenu()');
    await sleep(700);
    out($('cp-body') && $('cp-body').style.display !== 'none', '재렌더: 펼침 유지');
    out($('cp-q') && $('cp-q').value === '김', '재렌더: 검색어 유지', $('cp-q') ? $('cp-q').value : '(칸 없음)');
    out(D().querySelectorAll('#cp-result tbody tr').length === 3, '재렌더: 검색 결과 유지',
      String(D().querySelectorAll('#cp-result tbody tr').length));

    // E. 생일·취향 입력(저장) 후에도 유지 + 결과 갱신
    var editBtn = null;
    var btns = D().querySelectorAll('#cp-result button');
    for (var i = 0; i < btns.length; i++) if (btns[i].textContent.indexOf('생일·취향 입력') !== -1) { editBtn = btns[i]; break; }
    out(!!editBtn, '결과 줄에 "생일·취향 입력" 버튼이 있다');
    if (editBtn) {
      editBtn.click();
      await waitFor(function () { return $('cpf-taste'); }, 4000, '입력 모달');
      await sleep(200);
      $('cpf-taste').value = '홍삼 선호(테스트)';
      $('cpf-birth').value = '04-08';
      W().eval('submitClientProfile()');
      await waitFor(function () { return W().__QACalls['saveClientProfile'] === 1; }, 6000, '저장 호출');
      await sleep(900);
      out($('cp-body') && $('cp-body').style.display !== 'none', '저장 후: 펼침 유지');
      out($('cp-q') && $('cp-q').value === '김', '저장 후: 검색어 유지', $('cp-q') ? $('cp-q').value : '(칸 없음)');
      out(D().querySelector('#cp-result').textContent.indexOf('홍삼 선호(테스트)') !== -1, '저장 후: 결과가 새 값으로 갱신됨');
      out(D().querySelectorAll('#cp-result tbody tr').length === 3, '저장 후: 결과 3건 유지',
        String(D().querySelectorAll('#cp-result tbody tr').length));
    }

    // F. 접었다 다시 펼쳐도 결과·검색어 유지 (서버 재조회 없음)
    var callsBefore = W().__QACalls['searchClientsProfile'];
    $('cp-head').click();
    await sleep(300);
    out($('cp-body').style.display === 'none', '다시 접기: 본문 숨김');
    out(/^전체 3곳 · 클릭해서 펼치기$/.test(txt('cp-summary')), '다시 접기: 요약이 검색 결과 기준으로 갱신', txt('cp-summary'));
    $('cp-head').click();
    await sleep(300);
    out($('cp-body').style.display !== 'none', '다시 펼치기: 본문 표시');
    out($('cp-q').value === '김', '다시 펼치기: 검색어 유지');
    out(D().querySelectorAll('#cp-result tbody tr').length === 3, '다시 펼치기: 결과 유지');
    out(W().__QACalls['searchClientsProfile'] === callsBefore, '다시 펼치기: 서버 재조회 없음', String(W().__QACalls['searchClientsProfile']));

    // G. 키보드(Enter)로도 토글
    $('cp-head').dispatchEvent(new (W().KeyboardEvent)('keydown', { key: 'Enter', bubbles: true }));
    await sleep(250);
    out($('cp-body').style.display === 'none', '키보드 Enter: 접힌다');
    $('cp-head').dispatchEvent(new (W().KeyboardEvent)('keydown', { key: 'Enter', bubbles: true }));
    await sleep(250);
    out($('cp-body').style.display !== 'none', '키보드 Enter: 다시 펼쳐진다');

    // H. 오류 0건 + 버전
    var errs2 = W().__errs;
    out(errs2.length === 0, '전체 동작 중 런타임 오류 0건', errs2.join(' | '));
    var ver = W().eval('APP_VERSION');
    out(ver === 'v1.29', 'APP_VERSION 이 v1.29', String(ver));
    out(/v1\.29/.test(D().title), '화면 제목에 v1.29', D().title);

    var fails = lines.filter(function (l) { return l.indexOf('FAIL') === 0; }).length;
    note(fails ? ('실패 ' + fails + '건 / 전체 ' + lines.length + '건') : ('모두 통과 · 전체 ' + lines.length + '건'));
    window.__QA_RESULT = { total: lines.length, fails: fails, lines: lines };
    window.__QA_DONE = true;
  }

  main().catch(function (e) {
    out(false, 'QA 실행 오류: ' + String((e && e.message) || e));
    window.__QA_RESULT = { error: String((e && e.stack) || e), lines: lines };
    window.__QA_DONE = true;
  });
})();
</script>
</body>
</html>
