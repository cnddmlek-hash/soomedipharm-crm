<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA — v1.28 고시문·삭감통보서 읽기 (임시 확인용, 확인 후 삭제)</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  #wrap { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #stage { flex: 1 1 760px; max-width: 820px; background: #fff; border-radius: 8px; overflow: hidden; }
  #stage iframe { width: 100%; height: 1500px; border: 0; display: block; }
  #panel { flex: 0 0 360px; background: #111827; border-radius: 8px; padding: 12px; font-size: 12px; }
  #qa-log { white-space: pre-wrap; line-height: 1.55; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  h1 { font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><iframe id="app" src="about:blank"></iframe></div>
  <div id="panel">
    <h1>QA — v1.28 고시문·삭감통보서 읽기</h1>
    <div id="qa-log">준비 중…</div>
  </div>
</div>
<script>
(function () {
  var logEl = document.getElementById('qa-log');
  var out = [];
  var fails = 0;
  function say(text, cls) {
    out.push(text);
    logEl.innerHTML = out.map(function (line) {
      var c = line.indexOf('✘') === 0 ? 'bad' : (line.indexOf('✔') === 0 ? 'ok' : '');
      return '<span class="' + c + '">' + line.replace(/</g, '&lt;') + '</span>';
    }).join('\n');
  }
  function check(name, cond, detail) {
    if (cond) say('✔ ' + name);
    else { fails++; say('✘ ' + name + (detail ? ' → ' + detail : '')); }
  }

  var frame = document.getElementById('app');
  // GitHub Pages 가 index.html 을 10분간 캐시하므로, QA 판 번호를 붙여 항상 새 파일을 받습니다
  var qv = (new URLSearchParams(location.search)).get('v') || '0';
  frame.addEventListener('load', function () {
    if (!frame.contentWindow || !frame.contentWindow.document || frame.contentWindow.document.title.indexOf('QA') === -1 && !frame.contentWindow.document.getElementById('main-content')) return;
    var w = frame.contentWindow;
    var errors = [];
    w.addEventListener('error', function (e) { errors.push(String(e.message || e)); });

    var MOCK_CUT = {
      success: true, ocrOk: true, docKind: '삭감통보서', docKindKey: 'cut',
      summaryLines: [
        '약제 투여 기준(1일 1회)을 초과하여 처방된 건으로 확인되어 1회분을 삭감 조정함.',
        '요양급여의 적용기준 및 방법에 관한 세부사항(보건복지부 고시)에 따라 1일 1회만 인정됨.',
        '이의신청은 통보일로부터 90일 이내에 가능합니다.'
      ],
      codes: ['조정코드 0231', '보험코드 645001230'],
      dates: ['통보일 2026-11-20'],
      appealDraft: '[이의신청 / 재심사조정청구 사유서 초안]\n\n■ 청구기관: 서울연세내과의원\n■ 대상 품목: 케토롤락 트로메타민 주 30mg\n■ 관련 고시·문서번호: 조정코드 0231, 보험코드 645001230\n■ 시행일·적용일: 통보일 2026-11-20\n\n■ 통보(조정) 내용 요지\n - 약제 투여 기준을 초과하여 1회분을 삭감 조정함.\n\n■ 이의신청 사유\n 1. 위 품목은 관련 고시·급여기준에서 정한 산정(적용) 대상에 해당합니다.\n 2. [환자 상병/진료내역 기재] — 상병명, 처방일자, 투여량·기간을 적어 주세요.\n 3. 따라서 해당 삭감(조정) 처분은 재검토되어 주시기를 요청드립니다.\n\n■ 첨부서류: 진료기록부 사본, 처방전·투약기록, 관련 고시문 사본\n■ 작성일: 2026-11-29',
      rawTextPreview: '건강보험심사평가원 심사결과통보서 (요양기관용) …',
      message: '삭감통보서 로 읽었습니다 — 요약 3줄 · 코드 2개 · 날짜 1개. 초안을 보내기 전에 상병·진료내역을 채워 주세요.'
    };
    var MOCK_GOSI = {
      success: true, ocrOk: true, docKind: '고시·공지', docKindKey: 'notice',
      summaryLines: ['리투아민 성분 주사제는 다음 상병에 한하여 급여를 인정함.', '수액제 세트의 산정 기준을 1일 1회로 명확히 함.'],
      codes: ['제2026-312호'], dates: ['시행일 2026-12-01'],
      appealDraft: '[고시·공지 요약 및 이의신청 근거 메모 초안]\n\n■ 확인 병원: 서울연세내과의원\n■ 고시·문서번호: 제2026-312호\n\n■ 원내 확인 사항\n 1. 이 고시의 적용 대상에 우리 처방 품목이 해당하는지 확인해 주세요. [해당 품목·보험코드 기재]',
      rawTextPreview: '보건복지부 고시 제2026-312호 …',
      message: '고시·공지 로 읽었습니다 — 요약 2줄 · 코드 1개 · 날짜 1개. 초안을 보내기 전에 상병·진료내역을 채워 주세요.'
    };

    // ---- 앱 상태·서버 호출 대체 (시트 서버 없이 화면만 확인) ----
    w.__QA = { calls: [], lastPayload: null, mock: MOCK_CUT };
    w.runServer = function (fn, args) {
      w.__QA.calls.push({ fn: fn, args: args });
      if (fn === 'analyzeNoticeOrCutDoc') {
        var p = (args && args[0]) || {};
        w.__QA.lastPayload = {
          fileName: p.fileName, mimeType: p.mimeType, docType: p.docType,
          clientName: p.clientName, itemName: p.itemName, bytes: String(p.base64 || '').length
        };
        w.__QA.mock = (p.docType === 'notice') ? MOCK_GOSI : MOCK_CUT;
        return new Promise(function (resolve) { setTimeout(function () { resolve(w.__QA.mock); }, 120); });
      }
      if (fn === 'sendDocumentEmail') {
        w.__QA.mailPayload = (args && args[0]) || null;
        return Promise.resolve({ success: true, message: '이메일이 정상 발송되었습니다.', logs: [] });
      }
      if (fn === 'guideMakers') return Promise.resolve({ makers: [] });
      if (fn === 'getDeptGuide') return Promise.resolve({ depts: [] });
      if (fn === 'getCoverageNotes') return Promise.resolve({ items: [], categories: [], total: 0 });
      return Promise.resolve({});
    };

    w.print = function () { w.__QA.printed = (w.__QA.printed || 0) + 1; };   // 인쇄 대화상자 대신 호출만 셈
    try {
      w.eval([
        "STATE.user = { 아이디: 'qa', 담당자명: 'QA', 권한: 'MASTER' };",
        "STATE.authToken = 'qa-token'; STATE.isMaster = true; STATE.guestMode = false;",
        "STATE.settings = { '회사명': '수메디팜' }; STATE.today = '2026-11-29';",
        "STATE.clients = [{ 거래처코드: 'S001', 거래처명: '서울연세내과의원', 사용여부: 'Y', 이메일: 'doctor@example.com' },",
        "                 { 거래처코드: 'S002', 거래처명: '마포튼튼약국', 사용여부: 'Y' }];",
        "STATE.products = [{ 제품명: '케토롤락 트로메타민 주 30mg' }, { 제품명: '리투아민 주' }];",
        "document.getElementById('login-overlay').classList.add('hidden');",
        "document.getElementById('setup-overlay').classList.add('hidden');",
        "switchMenu('guide');"
      ].join('\n'));
    } catch (e) { check('가이드 화면 그리기', false, String(e && e.message || e)); }

    setTimeout(step2, 400);

    function step2() {
      var d = frame.contentDocument;
      check('처방 셋팅 화면에 📑 카드가 있다', !!d.getElementById('notice-card'));
      check('파일 선택·병원·품목·종류·실행 버튼이 있다',
        !!(d.getElementById('notice-file') && d.getElementById('notice-client') &&
           d.getElementById('notice-item') && d.getElementById('notice-doctype') && d.getElementById('notice-run')));
      check('거래처 선택지 2곳', d.querySelectorAll('#notice-client option').length === 3,
        String(d.querySelectorAll('#notice-client option').length));

      // 사이드바·모바일 메뉴 순서 — '약 검색 · 금기' 가 '월별 실적' 바로 아래인지
      function labels(sel, child) {
        return Array.prototype.map.call(d.querySelectorAll(sel), function (b) {
          var s = b.querySelectorAll('span');
          return s[child] ? String(s[child].textContent).trim() : '';
        });
      }
      var side = labels('#sidebar-nav .nav-btn', 1);
      var mob = labels('#mobile-nav .mnav-btn', 1);
      var si = side.indexOf('약 검색 · 금기'), mi = mob.indexOf('약검색');
      check('PC 사이드바: 약 검색 · 금기 = 월별 실적 바로 아래',
        si !== -1 && side[si - 1] === '월별 실적', side.slice(0, 8).join(' | '));
      check('PC 사이드바 순서 (전체)', side.join(' > ').indexOf('월별 실적 > 약 검색 · 금기 > 처방 셋팅') !== -1, side.join(' > '));
      check('모바일 하단 메뉴: 약검색 = 실적 바로 아래',
        mi !== -1 && mob[mi - 1] === '실적', mob.slice(0, 8).join(' | '));

      // ---- 파일 선택 → 분석 실행 ----
      try {
        var c = d.createElement('canvas');
        c.width = 2600; c.height = 1800;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#111'; ctx.font = 'bold 90px sans-serif';
        ctx.fillText('심사결과통보서 (QA)', 120, 300);
        ctx.font = '54px sans-serif';
        ctx.fillText('조정코드 0231 · 삭감사유: 투여 기준 초과', 120, 560);
      } catch (e) { check('시험용 사진 만들기', false, String(e && e.message || e)); }

      var done = false;
      var toBlob = function (cb) { c.toBlob(cb, 'image/jpeg', 0.9); };
      toBlob(function (blob) {
        done = true;
        var file = new w.File([blob], 'cut-qa.jpg', { type: 'image/jpeg' });
        w.__QA.originalBytes = blob.size;
        w.__QA_FILE = file;
        w.eval("NOTICE_DOC.file = __QA_FILE; NOTICE_DOC.meta = { clientCode: 'S001', itemName: '케토롤락 주', docType: 'auto' };");
        w.eval("noticeStatus_('📄 <b>' + 'cut-qa.jpg' + '</b> 선택됨 — [🔍 문서 읽고 초안 만들기]를 눌러 주세요.', '');");
        d.getElementById('notice-client').value = 'S001';
        d.getElementById('notice-item').value = '케토롤락 주';
        d.getElementById('notice-doctype').value = 'auto';

        var p = w.noticeAnalyze ? w.noticeAnalyze() : null;
        if (!p) { check('noticeAnalyze 호출', false, '함수 없음'); return; }
        Promise.resolve(p).then(function () { setTimeout(step3, 300); });
      });
      setTimeout(function () { if (!done) check('시험용 사진 만들기(toBlob)', false, '콜백 없음'); }, 4000);
    }

    function step3() {
      var d = frame.contentDocument;
      var pay = w.__QA.lastPayload || {};
      check('서버로 사진을 JPEG 로 줄여 보냄', pay.mimeType === 'image/jpeg', String(pay.mimeType));
      check('보낸 크기가 원본보다 작다', pay.bytes > 0 && pay.bytes < w.__QA.originalBytes,
        'base64 ' + pay.bytes + ' / 원본 ' + w.__QA.originalBytes);
      check('병원 이름·품목명이 함께 전달됨', pay.clientName === '서울연세내과의원' && pay.itemName === '케토롤락 주',
        JSON.stringify(pay));
      check('문서 종류 auto 로 전달', pay.docType === 'auto', String(pay.docType));

      var res = d.getElementById('notice-result');
      var text = res ? String(res.textContent) : '';
      check('결과 카드에 삭감통보서 배지', text.indexOf('삭감통보서') !== -1, text.slice(0, 120));
      check('핵심 요약 3줄 표시', res.querySelectorAll('li').length === 3, String(res.querySelectorAll('li').length));
      check('조정코드·보험코드 칩', text.indexOf('조정코드 0231') !== -1 && text.indexOf('보험코드 645001230') !== -1);
      check('통보일 칩', text.indexOf('통보일 2026-11-20') !== -1);
      var ta = d.getElementById('notice-draft');
      check('초안 상자에 사유서 초안', !!ta && ta.value.indexOf('[이의신청 / 재심사조정청구 사유서 초안]') === 0,
        ta ? ta.value.slice(0, 40) : '상자 없음');
      check('초안에 병원명·빈칸', !!ta && ta.value.indexOf('서울연세내과의원') !== -1 && ta.value.indexOf('[환자 상병/진료내역 기재]') !== -1);
      var copyBtn = Array.prototype.filter.call(res.querySelectorAll('button'), function (b) {
        return String(b.textContent).indexOf('📋 초안 복사') !== -1;
      })[0];
      check('📋 초안 복사 버튼이 있다', !!copyBtn);

      // ---- 고시·공지로 다시 읽기 ----
      var reBtn = Array.prototype.filter.call(res.querySelectorAll('button'), function (b) {
        return String(b.textContent).indexOf('고시·공지로 다시 읽기') !== -1;
      })[0];
      check('종류 바꿔 다시 읽기 버튼', !!reBtn);
      if (reBtn) reBtn.click();
      setTimeout(step4, 500);
    }

    function step4() {
      var d = frame.contentDocument;
      check('다시 읽기 요청이 docType notice 로 전달', (w.__QA.lastPayload || {}).docType === 'notice',
        String((w.__QA.lastPayload || {}).docType));
      var text = String(d.getElementById('notice-result').textContent);
      check('고시·공지로 다시 그려짐', text.indexOf('고시·공지') !== -1 && text.indexOf('제2026-312호') !== -1, text.slice(0, 100));
      var ta = d.getElementById('notice-draft');
      check('고시 메모 초안으로 바뀜', !!ta && ta.value.indexOf('[고시·공지 요약 및 이의신청 근거 메모 초안]') === 0,
        ta ? ta.value.slice(0, 40) : '상자 없음');

      w.noticeCopyDraft();
      setTimeout(function () {
        var toast = String(d.getElementById('toast').textContent || '');
        check('복사 버튼이 안내 문구를 보여 줌', toast.length > 0, toast);
        w.eval("noticeReanalyzeAs('cut')");     // PDF·메일은 삭감통보서 초안으로 확인
        setTimeout(step4b, 700);
      }, 250);
    }

    function step4b() {
      var d = frame.contentDocument;
      var res = d.getElementById('notice-result');
      function btn(text) {
        return Array.prototype.filter.call(res.querySelectorAll('button'), function (b) {
          return String(b.textContent).indexOf(text) !== -1;
        })[0];
      }
      var printBtn = btn('🖨️ PDF 저장 / 인쇄');
      var mailBtn = btn('✉️ 이메일 발송');
      check('PDF 저장 / 인쇄 버튼이 있다', !!printBtn);
      check('이메일 발송 버튼이 있다', !!mailBtn);

      if (printBtn) printBtn.click();
      var area = d.getElementById('print-area');
      var html = area ? String(area.innerHTML) : '';
      check('인쇄(A4) 문서가 만들어지고 print() 호출됨', (w.__QA.printed || 0) === 1, 'printed=' + w.__QA.printed);
      check('인쇄 문서에 사유서 제목·병원·초안', html.indexOf('이의신청 / 재심사조정청구 사유서 초안') !== -1 &&
        html.indexOf('서울연세내과의원') !== -1 && html.indexOf('[환자 상병/진료내역 기재]') !== -1);
      check('인쇄 문서에 핵심 요약·코드', html.indexOf('핵심 요약') !== -1 && html.indexOf('조정코드 0231') !== -1);

      if (mailBtn) mailBtn.click();
      setTimeout(function () {
        var modal = d.getElementById('email-modal');
        var open = !!(modal && /(^|\s)open(\s|$)/.test(String(modal.className)));
        check('이메일 발송 모달이 열린다', open, modal ? modal.className : '없음');
        var to = d.getElementById('em-to');
        var subj = d.getElementById('em-subject');
        var prev = d.getElementById('em-preview');
        check('거래처 이메일이 자동으로 채워짐', !!to && to.value === 'doctor@example.com', to ? to.value : '');
        check('수신 이메일 직접 수정 가능', !!to && !to.disabled && !to.readOnly);
        check('제목에 병원명·문서 종류', !!subj && subj.value.indexOf('서울연세내과의원') !== -1 && subj.value.indexOf('삭감통보서') !== -1,
          subj ? subj.value : '');
        check('미리보기에 사유서 초안', !!prev && String(prev.textContent).indexOf('[환자 상병/진료내역 기재]') !== -1);
        var sendBtn = Array.prototype.filter.call(modal.querySelectorAll('button'), function (b) {
          return String(b.textContent).indexOf('최종 발송하기') !== -1;
        })[0];
        check('최종 발송 버튼이 있다', !!sendBtn);
        if (sendBtn) sendBtn.click();
        setTimeout(function () {
          var pay = w.__QA.mailPayload || {};
          check('sendDocumentEmail 로 발송 요청', !!pay.to, JSON.stringify({ to: pay.to, docType: pay.docType, fileName: pay.fileName }));
          check('발송 문서 종류 = 고시·삭감분석', pay.docType === '고시·삭감분석', String(pay.docType));
          check('첨부 PDF 내용에 초안·요약', String(pay.pdfHtml || '').indexOf('이의신청 / 재심사조정청구 사유서 초안') !== -1 &&
            String(pay.pdfHtml || '').indexOf('조정코드 0231') !== -1);
          check('파일명에 병원명·pdf', String(pay.fileName || '').indexOf('서울연세내과의원') !== -1 && /\.pdf$/.test(String(pay.fileName || '')),
            String(pay.fileName));
          check('거래처명이 함께 전달됨', pay.clientName === '서울연세내과의원', String(pay.clientName));
          var toast = String(d.getElementById('toast').textContent || '');
          check('발송 완료 안내', toast.indexOf('이메일') !== -1, toast);
          step5();
        }, 500);
      }, 300);
    }

    function step5() {
      var d = frame.contentDocument;
      // 비회원 맛보기 메뉴 순서도 같은지
      try {
        w.eval("STATE.guestMode = true; STATE.activeMenu = 'guest'; buildNavMenus();");
        var mob = Array.prototype.map.call(d.querySelectorAll('#mobile-nav .mnav-btn'), function (b) {
          var s = b.querySelectorAll('span');
          return s[1] ? String(s[1].textContent).trim() : '';
        });
        var mi = mob.indexOf('🔒 약검색') !== -1 ? mob.indexOf('🔒 약검색') : mob.indexOf('약검색');
        check('비회원 맛보기 메뉴: 약검색 = 실적 바로 아래', mi !== -1 && mob[mi - 1].indexOf('실적') !== -1,
          mob.slice(0, 8).join(' | '));
        w.eval("STATE.guestMode = false; STATE.activeMenu = 'guide'; switchMenu('guide');");
      } catch (e) { check('비회원 맛보기 메뉴 확인', false, String(e && e.message || e)); }

      check('자바스크립트 오류 없음', errors.length === 0, errors.join(' / '));
      say('');
      say(fails === 0 ? '결과: 모두 통과 (' + (out.filter(function (l) { return l.indexOf('✔') === 0; }).length) + '건)' : '결과: 실패 ' + fails + '건');
      window.__QA_DONE = (fails === 0);
    }
  });
  frame.src = '../index.html?qa=notice&v=' + encodeURIComponent(qv);
})();
